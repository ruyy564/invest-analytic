# Шаблон отчёта «разбор портфеля».
# Состав, порядок, пороги и периоды задаются здесь — код отчёта не меняется.
# Схема и примеры: docs/reports.md
id: portfolio-review
version: 3
periods: [1d, 7d, 30d, 180d]
thresholds:
  concentration_high: 0.50
  concentration_medium: 0.25
  min_class_share: 0.05
sections:
  # С чего начинается разбор: бумага, сектор, доля, движение за 180 дней.
  # В разборе одной бумаги таблица портфеля не нужна: есть карточка бумаги.
  - id: table
    title: Состав портфеля
    provider: portfolio.table
    render: table
    scopes: [portfolio, account]
  # Экономический цикл: ставка ЦБ и что она значит для классов активов.
  - id: macro
    title: Экономический цикл и рынок
    provider: macro.context
    render: text
    interpret: true
    # Тема цикла обязательна: без неё модель трактует ставку без контекста фаз.
    knowledge: [cycles, impact-map, leaders-laggards, macro-transmission, stagflation, budget-rates, ruble-rate]
  # Фон рынка: общая сводка новостей за неделю (ветка новостей).
  - id: marketnews
    title: Фон рынка: новости
    provider: market.news
    render: text
    optional: true
  # По каждой бумаге: график, периоды, аналитики, дивиденды, её собственные новости.
  - id: securities
    title: Разбор по бумагам
    provider: securities.detail
    render: text
  - id: opinions
    title: Оценка бумаг и секторов
    provider: securities.opinions
    render: text
    interpret: true
    # Оценка опирается на отчётность, мультипликаторы и сравнение с сектором.
    knowledge: [reporting, multiples, news-reaction, leaders-laggards, stock-selection, price-drivers, market-gauges]
  # Аналитика бумаги: блоки собирает код из собранных чисел, модель их трактует.
  # Только разбор бумаги: в разборе портфеля это шум.
  - id: drivers
    title: Что влияет на бумагу
    provider: analytics.drivers
    render: list
    scopes: [instrument]
    optional: true
    knowledge: [sector-dependencies]
  - id: scorecard
    title: Хорошо, нейтрально, плохо
    provider: analytics.scorecard
    render: list
    scopes: [instrument]
    optional: true
    # Вердикты и пороги считает код: модель их не пересчитывает.
  - id: calendar
    title: Чего ждём
    provider: analytics.calendar
    render: list
    scopes: [instrument]
    optional: true
  # Вывод по бумаге: разбор «за и против» на основе всех собранных фактов.
  - id: conclusion
    title: Вывод по бумаге
    provider: securities.conclusion
    render: text
    interpret: true
    scopes: [instrument]
    optional: true
    knowledge: [reporting, multiples, strategies, sector-dependencies, news-reaction, leaders-laggards, impact-map, stock-selection]
  - id: structure
    title: Структура портфеля
    provider: portfolio.structure
    render: distribution
    # Разрезы портфеля нужны и по счёту, но в разборе одной бумаги это шум.
    scopes: [portfolio, account]
  # Внешнеэкономический профиль: экспортёры, внутренний рынок, импортёры.
  - id: exposure
    title: Экспортёры, импортёры и внутренний рынок
    provider: portfolio.exposure
    render: text
    scopes: [portfolio, account]
    knowledge: [trade-balance]
  - id: concentration
    title: Концентрация
    provider: portfolio.concentration
    render: kpi
    scopes: [portfolio, account]
  - id: tax
    title: Налоговый контекст
    provider: tax.context
    render: text
    scopes: [portfolio, account]
    # Налоги и издержки: доходность считается после них.
    knowledge: [taxes, tax-deductions]
  - id: gaps
    title: Пробелы в портфеле
    provider: portfolio.gaps
    render: list
    scopes: [portfolio, account]
  # Итог: диверсификация, тип стратегии и что поменять.
  # Это вывод по портфелю, а не по одной бумаге.
  - id: verdict
    title: Итог: диверсификация и стратегия
    provider: facts.brief
    render: text
    interpret: true
    scopes: [portfolio, account]
    # Стратегия — главный вывод раздела: тема обязательна, а не по весу.
    knowledge: [strategies, bond-review, macro-transmission, bond-prices, coupon-reinvest, strategy-choice]
