# База знаний по инвестициям.
# Формат: version + список topics. Каждая тема — определение (summary), тезисы (points),
# теги отбора (sections — разделы отчёта, sectors — секторы портфеля, keywords — термины
# вопроса) и источники.
# Важно: файл — данные, а не код. Тема добавляется строкой и сразу доступна отбору.
# В тезисах нет текущих чисел рынка — только принципы и исторические иллюстрации.
version: 1
topics:
  - id: cycles
    title: Экономические циклы
    summary: Цикл — чередование фаз роста, перегрева, спада и восстановления; для инвестора важна не дата разворота, а то, какие классы активов и секторы обычно ведут себя устойчивее в каждой фазе.
    points:
      - Фазы различают по росту ВВП, инфляции, ставке ЦБ и занятости — один показатель фазу не определяет
      - В восстановлении обычно сильнее акции роста и цикличные секторы, в поздней фазе — качество и дивиденды
      - В спаде растёт спрос на защитные классы — облигации высокого качества, золото, валютная диверсификация
      - Ставка ЦБ действует с задержкой в несколько кварталов, поэтому рынок реагирует на ожидания, а не на текущее значение
      - Диверсификация по классам активов важнее попытки угадать фазу — ошибка фазы стоит дороже, чем комиссия
      - Портфель, собранный под одну фазу, уязвим в следующей — поэтому структуру проверяют регулярно, а не раз в год
      - Признак перегрева — рост долгов и падение качества заёмщиков, а не только высокие цены активов
    sections: [macro, verdict]
    sectors: []
    keywords: [цикл, циклы, рецессия, спад, восстановление, перегрев, фаза]
    sources:
      - Говард Маркс, «О самом важном» — про циклы и риск
      - Рэй Далио, «Принципы изменения мирового порядка» — про долговые циклы
  - id: macro
    title: Макроэкономика и ключевая ставка
    summary: Макро для портфеля сводится к немногим связям — ставка и инфляция задают требуемую доходность, от неё зависят оценки акций, стоимость долга и привлекательность облигаций.
    points:
      - Рост ставки повышает дисконт будущих прибылей, поэтому сильнее страдают длинные истории роста
      - Банки обычно выигрывают от умеренно высоких ставок на кредитах, но страдают при резком росте стоимости фондирования
      - Инфляция бьёт по компаниям с низкой ценовой силой — ритейл и коммунальные услуги с регулируемыми тарифами
      - Реальная доходность вклада и облигаций — конкурент акциям, поэтому высокая безрисковая ставка давит на мультипликаторы
      - Курс валюты влияет на экспортёров и импортёров в противоположные стороны, а на внутренний долг — через стоимость обслуживания
      - Один макро-показатель не повод менять портфель — важна комбинация ставки, инфляции и ожиданий
    sections: [macro, opinions, verdict]
    sectors: [финансы, недвижимость]
    keywords: [ставка, инфляция, макро, макроэкономика, курс, валют, цб, дисконт]
    sources:
      - Асват Дамодаран, «Инвестиционная оценка» — про ставку дисконтирования
      - Аналитика БКС Экспресс — еженедельные обзоры ставки и рынка
  - id: multiples
    title: Мультипликаторы
    summary: Мультипликатор — это цена, делённая на измеритель бизнеса; сам по себе он ничего не значит, важен контекст отрасли, долга, цикла и качества прибыли.
    points:
      - P/E показывает, сколько рынок платит за рубль прибыли; сравнивать его можно только внутри отрасли и фазы цикла
      - P/B полезен для банков и компаний с материальными активами, но бесполезен там, где активы — это люди и бренды
      - EV/EBITDA учитывает долг, поэтому честнее сравнивает компании с разной нагрузкой
      - Дивидендная доходность без учёта устойчивости выплат превращается в ловушку высокой доходности
      - ROE и ROCE показывают отдачу на капитал, но высокий ROE при большом долге — это риск, а не качество
      - Долг/EBITDA выше трёх обычно означает чувствительность к ставке и слабую устойчивость в кризис
      - Бумага с низким P/E может быть дешёвой из-за падения прибыли — сначала проверяют, разовый ли это эффект
      - Мультипликаторы не работают для убыточных компаний и для цикличных на пике прибыли
    sections: [opinions, verdict]
    sectors: []
    keywords: [мультипликатор, p/e, p/b, ev/ebitda, dy, roe, долг, оценка, дорого, дёшево]
    sources:
      - Асват Дамодаран, «Инвестиционная оценка»
      - Бенджамин Грэм, «Разумный инвестор»
  - id: diversification
    title: Диверсификация и риск
    summary: Диверсификация — единственный бесплатный способ снизить риск портфеля; она работает только там, где активы не падают одновременно, поэтому важны и классы, и секторы, и валюты.
    points:
      - Различают диверсификацию по классам, секторам, эмитентам, валютам и срокам — одна ось не заменяет другую
      - Доля одной бумаги выше 10 процентов уже делает портфель зависимым от одной истории
      - Облигации и золото снижают просадку акций не всегда, а в определённых фазах — корреляция меняется
      - Три-четыре крупные позиции одного сектора — это одна ставка, даже если эмитенты разные
      - Концентрация усиливает результат в обе стороны — если цель сохранить капитал, она противоречит цели
      - Ребалансировка возвращает заданные доли и заодно фиксирует перекос, но частые сделки съедают результат издержками
      - Диверсификация не защищает от системного риска — общий обвал рынка затрагивает всё
    sections: [verdict, macro]
    sectors: []
    keywords: [диверсификация, концентрация, риск, корреляция, доля, ребалансировка, структура]
    sources:
      - Бертон Малкиел, «Случайная прогулка по Уолл-стрит»
      - Гарри Марковиц — портфельная теория, базовая работа о корреляциях
  - id: psychology
    title: Психология принятия решений
    summary: Большая часть потерь частного инвестора — не от плохих бумаг, а от решений под эмоциями; знание своих искажений дешевле, чем любая аналитика.
    points:
      - Неприятие потерь заставляет держать убыточные позиции и продавать прибыльные — эффект диспозиции
      - FOMO и стадное поведение приводят к покупке на пике, когда о бумаге говорят все
      - Якорение на цене покупки мешает оценивать бумагу по текущим перспективам
      - Эффект недавности переоценивает последние месяцы и распространяет их на будущее
      - Подтверждение своей правоты заставляет читать только согласные с позицией источники
      - Излишняя уверенность в собственном прогнозе ведёт к чрезмерной концентрации и плечу
      - Дисциплина держится на правилах заранее — доля на бумагу, лимит потерь, дата пересмотра, а не на настроении
      - Дневник решений с причиной входа помогает отделить ошибку анализа от ошибки поведения
    sections: [verdict, opinions]
    sectors: []
    keywords: [психология, поведение, эмоции, fomo, искажение, дисциплина, якорь, паника, жадность]
    sources:
      - Даниэль Канеман, «Думай медленно, решай быстро»
      - Джейсон Цвейг, «Ваше право быть богатым» — про поведенческие ловушки

  - id: sector-dependencies
    title: Зависимости секторов
    summary: Каждый сектор зависит от своего набора факторов; понимание этой связки важнее общей оценки рынка, потому что портфель состоит из конкретных секторов.
    points:
      - Финансы зависят от ставки, стоимости фондирования, качества кредитного портфеля и достаточности капитала
      - Энергетика зависит от цен на нефть и газ, налогового режима, курса и объёмов добычи
      - Материалы (металлурги, удобрения, золото) зависят от мировых цен на сырьё, тарифов, экспортных пошлин и курса
      - Промышленность зависит от инвестиционного спроса, госзаказа, логистики и стоимости кредита
      - Потребительские товары и ритейл зависят от доходов населения, инфляции издержек и покупательной способности
      - Недвижимость и девелопмент зависят от ипотечной ставки, льготных программ и стоимости финансирования
      - Телеком и коммунальные услуги зависят от тарифного регулирования и инфляции издержек
      - Информационные технологии зависят от курса, господдержки, экспорта и доступности оборудования
      - Транспорт зависит от объёмов грузооборота, тарифов и стоимости топлива
      - Здравоохранение зависит от госзакупок, регулирования цен на препараты и импорта оборудования
      - Один сектор редко растёт без причины — если непонятен драйвер, непонятна и устойчивость идеи
    sections: [macro, opinions, verdict]
    sectors: [финансы, энергетика, материалы, промышленность, потребительские товары, потребительские услуги, недвижимость, телеком, коммунальные услуги, информационные технологии, транспорт, здравоохранение]
    keywords: [сектор, секторы, банк, нефтегаз, металлург, ритейл, девелопер, телеком, тариф, отрасл]
    sources:
      - Аналитика БКС Экспресс — отраслевые обзоры по эмитентам
      - Питер Линч, «Метод Питера Линча» — о том, как понимать бизнес отрасли
  - id: commodities
    title: Металлы и эмитенты
    summary: Цены на металлы транслируются в выручку экспортёров, издержки переработчиков и курс валюты; один и тот же рост цены металла выгоден одним эмитентам и вреден другим.
    points:
      - Рост цен на медь, никель и палладий поддерживает выручку добывающих компаний и давит на машиностроение и электронику как на потребителей сырья
      - Сталь и железная руда влияют на металлургов с полным циклом и на строительный сектор через стоимость материалов
      - Золото воспринимается как защитный актив и реагирует на реальную ставку и спрос на защиту, а не только на инфляцию
      - Алюминий чувствителен к стоимости электроэнергии, поэтому цены на энергию меняют маржу производителей
      - Удобрения зависят от цен на газ, и рост газа переносится в себестоимость
      - Для экспортёров важен не только уровень цены, но и курс — ослабление валюты частично компенсирует падение цен
      - Разовые факторы (пошлины, логистика, ограничения) меняют картину сильнее мирового цикла
      - Металлы цикличны — высокая цена обычно привлекает предложение и давит на неё через один-два года
    sections: [opinions, verdict]
    sectors: [материалы, энергетика, промышленность]
    keywords: [металл, металлы, медь, никель, алюминий, золото, палладий, сталь, руда, сырьё, удобрения]
    sources:
      - Аналитика БКС Экспресс — сырьевые обзоры
      - Асват Дамодаран — цикличность и нормализация прибыли

  - id: history
    title: История бумаг, кризисы и восстановление
    summary: История рынка показывает повторяющиеся сценарии — пузырь, обвал, восстановление; сроки восстановления разные, поэтому выживание портфеля важнее точного входа.
    points:
      - Кризис 1998 года в России прошёл через дефолт, девальвацию и обвал банковской системы, восстановление заняло годы
      - Кризис 2008 года начался с ипотечных бумаг и перешёл в глобальную рецессию, сильнее всего пострадали банки и девелоперы
      - В 2014 году сработали санкции, ослабление рубля и рост ставки, сильнее просели банки и потребительский сектор
      - Обвал 2020 года был самым быстрым, а восстановление — самым коротким для технологических компаний
      - События 2022 года закрыли часть внешних рынков и перестроили структуру владения, восстановление отдельных бумаг шло неравномерно
      - Восстановление редко бывает одномоментным — исторически это годы, а не месяцы, и не у всех бумаг оно происходит
      - Компании с долгом и слабым денежным потоком в кризис теряют больше и восстанавливаются дольше
      - Уроки повторяются — плечо, концентрация и вера в «на этот раз иначе» стоят дороже неверной оценки
      - Исторические примеры нужны для понимания механики, а не как обещание будущей доходности
    sections: [macro, verdict]
    sectors: []
    keywords: [кризис, кризисы, история, обвал, восстановление, дефолт, пузырь]
    sources:
      - Чарльз Киндлбергер, «Мировые финансовые кризисы»
      - Джон Богл, «Общий фондовый индекс» — о долгом горизонте
  - id: decision-checklist
    title: Чек-лист принятия решений
    summary: Решение по бумаге или портфелю — это не «нравится или нет», а последовательность проверок; чек-лист защищает от пропущенного риска и от решения под эмоциями.
    points:
      - Определи цель и горизонт — сохранение капитала, доход, рост — от них зависит допустимый риск
      - Оцени допустимую просадку — если падение на четверть заставит продать, структура выбрана неверно
      - Проверь долю позиции и сектора — концентрация важнее выбора отдельной бумаги
      - Проверь качество бизнеса — долг, денежный поток, устойчивость выручки, зависимость от одного рынка
      - Сравни оценку с историей и отраслью — дорого или дёшево имеет смысл только в контексте
      - Учти издержки и налоги — комиссия, спред, налог с дивидендов и продажи меняют результат
      - Проверь ликвидность — узкая бумага не даст выйти по ожидаемой цене
      - Запиши причину решения и условие пересмотра — цена, событие или дата
      - Проверяй структуру портфеля регулярно и по правилу, а не по настроению
      - Не принимай решение по одному дню динамики и не переноси последние месяцы на будущее
    sections: [verdict, opinions, macro]
    sectors: []
    keywords: [решение, решения, что делать, чек-лист, план, горизонт, риск, цель, покупать, продавать, держать]
    sources:
      - Говард Маркс, «О самом важном»
      - Бенджамин Грэм, «Разумный инвестор»
  - id: sources
    title: Источники знаний и литературы
    summary: База знаний опирается на классическую литературу по оценке и поведению инвестора, а также на публичную аналитику брокеров; это ориентиры для трактовки, а не источник текущих цен.
    points:
      - Аналитика БКС Экспресс — обзоры рынка, идеи и комментарии к отчётности, попадает в новостную ленту сервиса
      - Бенджамин Грэм, «Разумный инвестор» — маржа безопасности и дисциплина оценки
      - Бертон Малкиел, «Случайная прогулка по Уолл-стрит» — индексный подход и диверсификация
      - Питер Линч, «Метод Питера Линча» — понимание бизнеса за цифрами
      - Говард Маркс, «О самом важном» — циклы, риск и второй уровень мышления
      - Асват Дамодаран, «Инвестиционная оценка» — ставка дисконтирования и мультипликаторы
      - Даниэль Канеман, «Думай медленно, решай быстро» — искажения решений
      - Чарльз Киндлбергер, «Мировые финансовые кризисы» — механика пузырей и паник
      - Книга — это метод, а не сигнал; текущие решения принимаются по данным портфеля и рынка
    sections: [macro, opinions, verdict]
    sectors: []
    keywords: [книга, книги, литература, источник, источники, бкс, читать, почитать]
    sources:
      - Аналитика БКС Экспресс
      - Классическая литература по инвестициям и экономике

