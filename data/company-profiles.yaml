# Профили секторов и компаний: драйверы и внешнеэкономический профиль.
# Данные, а не код: драйверы сектора и профиль бумаги правятся без сборки.
# currency / rate — чувствительность выручки: positive (рост фактора в плюс),
# negative (в минус), neutral (влияние слабое или двустороннее).
version: 1
sectors:
  - key: energy
    drivers: [цена нефти Brent и Urals, курс рубля, налоговый режим (НДПИ, демпфер), объёмы добычи и экспорта]
    factors: [Brent, Urals, ОПЕК, нефть, НПЗ, демпфер, НДПИ, добыч]
    currency: positive
    rate: negative
  - key: materials
    drivers: [мировые цены на металлы и сырьё, курс рубля, экспортные пошлины, спрос Китая]
    factors: [металл, золот, алюмини, никел, сталь, медь, медн, пошлин, Кита, руда]
    currency: positive
    rate: negative
  - key: financial
    drivers: [ключевая ставка, качество кредитного портфеля, инфляция, регулирование и достаточность капитала]
    factors: [ключевая ставка, инфляц, ЦБ, кредит, достаточность капитала, банковский сектор]
    currency: neutral
    rate: positive
  - key: consumer
    drivers: [реальные доходы населения, инфляция издержек, потребительский спрос, импортная составляющая]
    factors: [доходы, потребительский спрос, инфляц, розниц]
    currency: negative
    rate: negative
  - key: consumer_goods
    drivers: [реальные доходы, трафик и средний чек, инфляция издержек и логистики, доля импортного ассортимента]
    factors: [трафик, средний чек, издержк, импорт, логистик, ритейл]
    currency: negative
    rate: negative
  - key: consumer_services
    drivers: [реальные доходы, занятость, ставка по потребительским кредитам, уверенность потребителя]
    factors: [занятост, потребительский кредит, спрос, доходы]
    currency: negative
    rate: negative
  - key: it
    drivers: [экспортная выручка и курс, господдержка, доступность оборудования и софта, стоимость капитала]
    factors: [оборудован, софт, господдержк, рекламн, выручк, курс]
    currency: positive
    rate: negative
  - key: telecom
    drivers: [тарифное регулирование, капитальные затраты на инфраструктуру, курс на оборудование]
    factors: [тариф, инфраструктур, оборудован, абонент]
    currency: negative
    rate: neutral
  - key: utilities
    drivers: [тарифы, цены на топливо, износ сетей, стоимость обслуживания долга]
    factors: [тариф, топлив, сетев, электросет, обслуживание долга]
    currency: negative
    rate: negative
  - key: green_energy
    drivers: [стоимость капитала, господдержка и тарифы, цены на оборудование и комплектующие]
    factors: [тариф, оборудован, стоимость капитала, господдержк]
    currency: negative
    rate: negative
  - key: real_estate
    drivers: [ипотечная ставка и льготные программы, реальные доходы, стоимость проектного финансирования]
    factors: [ипотек, льготн, проектное финансирование, доходы, ставк]
    currency: negative
    rate: negative
  - key: transport
    drivers: [грузооборот и пассажиропоток, тарифы, стоимость топлива, доступность лизинга]
    factors: [грузооборот, пассажиропоток, тариф, лизинг, топлив]
    currency: negative
    rate: negative
  - key: healthcare
    drivers: [госзакупки, регулирование цен на препараты, импорт оборудования, курс]
    factors: [госзакупк, препарат, импорт оборудован, курс]
    currency: negative
    rate: neutral
  - key: electronics
    drivers: [госзаказ и инвестиционный спрос, доступность комплектующих, курс, ставка]
    factors: [госзаказ, комплектующ, курс, ставк]
    currency: negative
    rate: negative
  - key: industrials
    drivers: [инвестиционный спрос, госзаказ, стоимость кредита, логистика]
    factors: [инвестиционный спрос, госзаказ, кредит, логистик]
    currency: negative
    rate: negative
  - key: other
    drivers: []
    factors: []
    currency: neutral
    rate: neutral
