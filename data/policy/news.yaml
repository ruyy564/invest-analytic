# Политика релевантности новостей. Правила — данные, а не код источников.
# Изменение поведения: новая строка/регулярка здесь, без правок TypeScript.
version: 2

# Общие сводки: брокер и каналы помечают их всеми тикерами, но к бумаге они не относятся.
digest:
  - "утренн"
  - "вечерн"
  - "дайджест"
  - "итоги (дня|недели|месяца|торгов|рынка|квартала|года)"
  - "главное за"
  - "обзор рынка"
  - "обзор недели"
  - "неделя на рынке"
  - "что случилось"
  - "календарь"
  - "расписание"
  - "подборк"
  - "идеи недели"
  - "что купить"

# Темы вне инвестиционной повестки: нужны общей ленте, где нет фильтра по бумаге.
off_topic:
  - "спорт|матч|футбол|хокке|теннис|олимпи|чемпионат|тренер|кхл|нхл"
  - "фильм|сериал|премьер|режисс|актёр|актер|концерт|шоу|звезда|фоторепортаж"
  - "гороскоп|рецепт|погода|дтп|пожар|убийств|задержан|приговор|развод"
  - "знаменитост|телеведущ|инстаграм|тикток"
  - "акци[яию]х?\\s+(?:по|всеобщ|протест)|забастовк"
  - "гумпомощ|возвращени[еяю] детей|церков|патриарх|фестивал|выставк"
  - "митинг|протест|подал в отставку|реконструкц|благоустройств|капремонт"
  - "поликлиник|водоснабж|детск(?:ий|ого) сад|мировой суд"

# Маркеры инвестиционной повестки: без них общая лента в сводку не попадает.
investment_markers:
  - "рынк"
  - "акци"
  - "облигац"
  - "дивиденд"
  - "ставк"
  - "центробанк|\\bцб\\b"
  - "инфляц"
  - "рубл|доллар"
  - "нефт|золот|металл"
  - "индекс|мосбирж|бирж"
  - "эмитент|отчётн|отчетн|выручк|прибыл[ьи]|убыт"
  - "ipo|spo|etf|фьючерс|котиров|капитализац"
  - "инвест|брокер|регулятор|санкц|тариф|налог|бюджет|ввп|экспорт|импорт"
  - "экономик|ипотек|кредит|депозит|банк|фонд|акционер|аналитик"

# Правила привязки к бумаге.
relevance:
  # Проверять совпадение с бумагой по заголовку, а не по аннотации:
  # обзор «акции нефтяных компаний» упоминает бумагу в тексте, но новостью по ней не является.
  by_ticker: title_only
  # Тег инструмента от источника считается привязкой (РБК проставляет тикеры).
  allow_tag_binding: true
