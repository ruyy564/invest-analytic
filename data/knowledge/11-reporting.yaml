    sectors: []
    keywords: [отчётность, отчетность, мсфо, рсбу, выручка, ebitda, прибыль, денежный поток, fcf, долг, маржа, рентабельность, roe, roic, капитальные затраты, дивидендная политика, аудит]
    sources:
