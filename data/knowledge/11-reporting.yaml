# Тема: как читать отчётность эмитента.
# Файл — часть базы знаний: порядок задаёт имя файла, тезисы — одна строка.
version: 1
topics:
  - id: reporting
    title: Как читать отчётность эмитента
    summary: Отчётность отвечает на три вопроса — сколько компания зарабатывает, сколько у неё долга и сколько денег остаётся после инвестиций; прибыль без денежного потока и растущий долг — главные красные флаги.
    points:
      - Сначала смотрят отчёт о движении денежных средств, потом отчёт о прибылях — так видно, превращается ли прибыль в деньги
      - Выручка без маржинальности не говорит о качестве бизнеса — важны валовая, операционная и чистая маржа в динамике
      - EBITDA удобна для сравнения компаний с разной нагрузкой на амортизацию, но не заменяет денежный поток
      - Свободный денежный поток — операционный поток минус капитальные затраты; именно он платит дивиденды и долг
      - Чистый долг к EBITDA выше 3 обычно означает повышенный риск, но норма зависит от отрасли и стабильности выручки
      - Разовая прибыль от переоценки, продажи активов или курсовых разниц не повторяется — её вычитают из оценки
      - Отчётность РСБУ и МСФО могут расходиться по прибыли и долгу — сравнивать компании нужно в одной методологии
      - Примечания к отчётности часто важнее самих таблиц: там раскрыты долг, залоги, ковенанты и связанные стороны
      - Аудиторское заключение с оговоркой или смена аудитора без причины — повод проверить качество прибыли
      - Дивидендная политика читается вместе с денежным потоком и долгом, иначе обещанные выплаты могут быть необеспеченными
    details:
      - title: Отчёт о прибылях и убытках
        points:
          - Выручка — объём продаж; рост сам по себе не создаёт стоимости, если растут затраты и долг
          - Валовая маржа показывает pricing power, операционная — эффективность, чистая — итог после процентов и налогов
          - Амортизация не денежный расход, но она отражает износ активов и будущие капитальные затраты
          - Проценты по долгу растут вместе со ставкой — при плавающем долге прибыль чувствительна к её изменению
          - Сравнивать компании корректно по одинаковым периодам, валюте и методологии учёта
      - title: Отчёт о движении денежных средств
        points:
          - Операционный поток — деньги от основной деятельности; он должен быть положительным у зрелого бизнеса
          - Капитальные затраты делятся на поддержание и рост; поддержание примерно равно амортизации
          - Свободный поток может быть отрицательным при инвестициях в рост — тогда важно, окупаются ли вложения
          - Рост дебиторской задолженности быстрее выручки означает, что деньги «зависли» у покупателей
          - Сезонность кварталов не отменяет годовой картины — оценивают отчёт за 12 месяцев
      - title: Долг и устойчивость
        points:
          - Чистый долг считают как долг минус денежные средства и эквиваленты
          - Долговая нагрузка сравнивается с EBITDA, покрытие процентов — с операционной прибылью
          - Короткий долг при длинных активах создаёт риск рефинансирования, особенно при росте ставки
          - Ковенанты и залоги в примечаниях могут ограничить выплату дивидендов и доступ к новому кредиту
          - Рост долга при падающей EBITDA — самый ранний признак проблем, раньше снижения дивидендов
      - title: Качество прибыли
        points:
          - Прибыль считается качественной, если подтверждается денежным потоком и не зависит от разовых статей
          - Переоценка активов, курсовые разницы и продажа имущества искажают сравнение периодов
          - Обесценение основных средств или гудвилла — сигнал, что прошлые инвестиции не оправдались
          - Сделки со связанными сторонами проверяют по примечаниям — они могут перераспределять прибыль
          - Частые изменения учётной политики и переносы расходов между периодами усложняют оценку
      - title: Что смотреть первым делом
        points:
          - Динамику выручки и маржи за 8–12 периодов, а не за один отчёт
          - Свободный денежный поток и его отношение к прибыли
          - Чистый долг к EBITDA и график погашения
          - Дивидендную политику и фактическую историю выплат
          - Примечания про долг, залоги, ковенанты и связанные стороны
    pitfalls:
      - Смотреть только на заголовок «прибыль выросла» без проверки денежного потока
      - Сравнивать P/E компаний с разной структурой долга и отраслевой цикличностью
      - Считать EBITDA денежным потоком и платить за неё как за деньги
      - Игнорировать примечания и аудиторское заключение
      - Оценивать компанию по одному кварталу при сезонном бизнесе
