# Тема: чек-лист принятия решений.
version: 1
topics:
  - id: decision-checklist
    title: Чек-лист принятия решений
    summary: Решение по бумаге или портфелю — это не «нравится или нет», а последовательность проверок; чек-лист защищает от пропущенного риска и от решения под эмоциями.
    points:
      - Определи цель и горизонт — сохранение капитала, доход, рост — от них зависит допустимый риск
      - Оцени допустимую просадку — если падение на четверть заставит продать, структура выбрана неверно
      - Проверь долю позиции и сектора — концентрация важнее выбора отдельной бумаги
      - Проверь качество бизнеса — долг, денежный поток, устойчивость выручки, зависимость от одного рынка
      - Сравни оценку с историей и отраслью — дорого или дёшево имеет смысл только в контексте
      - Учти издержки и налоги — комиссия, спред, налог с дивидендов и продажи меняют результат
      - Проверь ликвидность — узкая бумага не даст выйти по ожидаемой цене
      - Запиши причину решения и условие пересмотра — цена, событие или дата
      - Проверяй структуру портфеля регулярно и по правилу, а не по настроению
      - Не принимай решение по одному дню динамики и не переноси последние месяцы на будущее
    details:
      - title: Перед покупкой
        points:
          - Какую роль играет бумага в портфеле и какую долю займёт
          - Что известно о бизнесе: выручка, маржа, долг, денежный поток
          - Почему цена сейчас привлекательна — конкретный аргумент, а не «растёт»
          - Что должно случиться, чтобы идея перестала работать
          - Хватит ли ликвидности, чтобы выйти без потери цены
      - title: Перед продажей
        points:
          - Изменились ли факты, на которых строилась идея
          - Не продаём ли только потому, что цена упала
          - Не продаём ли прибыльную позицию только чтобы «зафиксировать»
          - Как изменится структура портфеля и концентрация после сделки
          - Какие налоги и издержки возникнут при продаже
      - title: Пересмотр портфеля
        points:
          - По календарю или по отклонению доли от целевой — правило выбирают заранее
          - Проверяют доли классов и секторов, а не только цены бумаг
          - Смотрят, не появился ли новый крупный риск в одном эмитенте
          - Отдельно оценивают, изменилась ли цель или горизонт
      - title: Дневник решений
        points:
          - Дата, бумага, доля, причина входа, ожидание и условие пересмотра
          - Отметка, что произошло и была ли ошибка анализа или поведения
          - Регулярный разбор дневника помогает ловить повторяющиеся ошибки
          - Решение оценивают по процессу, а не по результату
    pitfalls:
      - Покупать на эмоциях без записанной причины
      - Ставить долю больше плана из-за уверенности в идее
      - Игнорировать налоги и издержки при расчёте результата
      - Пересматривать стратегию после каждого убыточного месяца
    sections: [verdict, opinions, macro]
    sectors: []
    keywords: [решение, решения, что делать, чек-лист, план, горизонт, риск, цель, покупать, продавать, держать]
    sources:
      - Говард Маркс, «О самом важном»
      - Бенджамин Грэм, «Разумный инвестор»
