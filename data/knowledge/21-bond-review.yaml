# Тема: как выбирать корпоративные облигации — по мотивам обзоров Т-Инвестиций.
version: 1
topics:
  - id: bond-review
    title: Как выбрать корпоративную облигацию
    summary: Облигация — это кредит эмитенту; доходность отражает риск и ликвидность, а не подарок, поэтому сравнивают её с ОФЗ и ключевой ставкой, а не с обещаниями.
    points:
      - Доходность к погашению сравнивают с ОФЗ и ключевой ставкой: премия платится за кредитный риск и ликвидность
      - Короткие выпуски меньше зависят от изменения ставки; длинные дают больше при снижении ставки и больше просадку при росте
      - Флоатер с привязкой к ключевой ставке или RUONIA защищает в период высокой ставки, но при её снижении доход падает
      - Put-оферта — право вернуть бумагу эмитенту по номиналу в дату оферты; без оферты досрочный выход только через рынок
      - Кредитные метрики важнее рейтинга: долг к EBITDA, покрытие процентов, запас ликвидности, качество активов
      - Рейтинг — не гарантия: смотрите на динамику рейтинга, структуру долга и график погашений
      - Для флоатеров честный ориентир — эффективная премия к референсной ставке, а не номинал купона
      - Амортизация возвращает номинал частями: риск ниже, но и доходность к погашению считается иначе
      - Ежемесячные купоны дают ротацию капитала — удобно, когда ставки и условия быстро меняются
    details:
      - title: Виды купона
        points:
          - Фиксированный купон — понятная доходность, но цена чувствительна к ставке
          - Плавающий купон (ключевая ставка, RUONIA) — доход следует за ставкой, защиты от её снижения нет
          - Индексируемый номинал (ОФЗ-ИН) — защита от инфляции, но ниже текущая доходность
          - Дисконтные выпуски — доход в разнице цены и номинала, купонов нет
      - title: Что проверить перед покупкой
        points:
          - Доходность к погашению и к оферте — сравнивайте обе, если оферта раньше погашения
          - Долг к EBITDA и покрытие процентов: растёт долг быстрее прибыли — риск повышен
          - График погашений и оферт: крупный выкуп в один год — риск рефинансирования
          - Ликвидность выпуска: объём, спред, частота сделок — выход может быть дорогим
          - Налоги и комиссии: доходность после них отличается от обещанной
      - title: Когда облигации лучше депозита
        points:
          - Если нужна фиксированная доходность на срок и есть ликвидность для выхода
          - Если ставка снижается: длинные ОФЗ и качественные корпораты фиксируют доход
          - Депозит проще и защищён страхованием в пределах лимита, облигация — рыночный риск
          - Для коротких сроков и мелких сумм депозит часто выигрывает по удобству
      - title: Как заметить риск дефолта заранее
        points:
          - Резкий рост доходности выпуска без новостей — рынок переоценивает риск
          - Снижение рейтинга и перенос оферты — сигналы слабости эмитента
          - Отчётность с падающей прибылью и растущим долгом — проверять денежный поток
          - Смена аудитора, задержки отчётности, технические дефолты — красные флаги
    pitfalls:
      - Гнаться за максимальной доходностью, не глядя на кредитные метрики
      - Считать рейтинг гарантией выплат
      - Игнорировать оферту и покупать длинную бумагу «под снижение ставки» без запаса риска
      - Сравнивать флоатер по номиналу купона с фиксированным выпуском по доходности к погашению
