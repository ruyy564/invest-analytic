# Тема: как выбрать инвестиционную стратегию (Академия Т-Инвестиций).
version: 1
topics:
  - id: strategy-choice
    title: Выбор инвестиционной стратегии
    summary: Универсальной стратегии нет: она выводится из цели, горизонта, допустимой просадки и готовности тратить время, а не из моды или доходности чужого портфеля.
    points:
      - Первый вопрос — цель и горизонт: сохранить капитал, получать доход или растить капитал
      - Второй — допустимая просадка: если падение на четверть заставит продать, риск слишком высок
      - Третий — время и желание разбираться: активная стратегия требует анализа, пассивная — дисциплины
      - Есть выбор между компаниями роста и зрелыми устойчивыми игроками — доходность и риск разные
      - Дивиденды важны не всем: они снижают реинвестирование, но дают регулярный поток
      - Пассивные инвестиции (индексные фонды) дают рынок целиком и дешевле активных
      - Активная стратегия оправдана, если есть процесс отбора и время на анализ
      - Чужие рекомендации допустимы, но ответственность и критерии проверки остаются на инвесторе
    details:
      - title: Четыре вопроса к себе
        points:
          - Зачем я инвестирую и когда понадобятся деньги
          - Какую просадку выдержу без паники
          - Сколько времени готов тратить на анализ
          - Нужен ли регулярный доход или рост капитала
      - title: Основные типы стратегий
        points:
          - Пассивная: индексные фонды, широкая диверсификация, минимум решений
          - Активная: отбор бумаг по качеству и оценке, больше работы и издержек
          - Дивидендная: поток выплат, проверка устойчивости дивидендов
          - Рост: компании с высокой динамикой, выше волатильность
          - Защитная: устойчивый спрос, короткие облигации, меньше просадка
      - title: Как проверить выбор
        points:
          - Стратегия должна быть понятна в одном предложении
          - У неё есть правила входа, ребалансировки и выхода
          - Её результат сравним с простым ориентиром (индекс, депозит)
          - Её можно соблюдать в плохой год без изменения правил
      - title: Типичные ошибки
        points:
          - Копировать чужой портфель без понимания риска
          - Менять стратегию после каждой просадки
          - Путать высокую доходность прошлого года с устойчивостью
          - Игнорировать налоги и комиссии при выборе активной стратегии
    pitfalls:
      - Выбирать стратегию по доходности чужого скриншота
      - Держать активную стратегию без времени на анализ
      - Игнорировать допустимую просадку
      - Менять правила на каждом движении рынка
    sections: [verdict, macro]
    sectors: []
    keywords: [стратегия, горизонт, риск, просадка, пассивная, активная, дивиденды, рост, защитная, индексный фонд]
    sources:
      - Т-Инвестиции, «Какая стратегия на рынке акций подходит конкретно вам»
