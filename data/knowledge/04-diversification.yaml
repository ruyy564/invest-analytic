# Тема: диверсификация и риск.
version: 1
topics:
  - id: diversification
    title: Диверсификация и риск
    summary: Диверсификация — единственный бесплатный способ снизить риск портфеля; она работает только там, где активы не падают одновременно, поэтому важны и классы, и секторы, и валюты.
    points:
      - Различают диверсификацию по классам, секторам, эмитентам, валютам и срокам — одна ось не заменяет другую
      - Доля одной бумаги выше 10 процентов уже делает портфель зависимым от одной истории
      - Три-четыре крупные позиции одного сектора — это одна ставка, даже если эмитенты разные
      - Облигации и золото снижают просадку акций не всегда, а в определённых фазах — корреляция меняется
      - Концентрация усиливает результат в обе стороны — если цель сохранить капитал, она противоречит цели
      - Ребалансировка возвращает заданные доли и фиксирует перекос, но частые сделки съедают результат издержками
      - Диверсификация не защищает от системного риска — общий обвал рынка затрагивает всё
      - Риск измеряют не только волатильностью, но и допустимой просадкой и горизонтом
    details:
      - title: Оси диверсификации
        points:
          - Классы активов: акции, облигации, денежный рынок, золото, недвижимость
          - Секторы: финансы, сырьё, потребительский, технологии, тарифные отрасли
          - Эмитенты и бизнес-модели: экспортёр и внутренний рынок реагируют на разное
          - Валюты и юрисдикции: снижают зависимость от одной денежной политики
          - Сроки: короткие и длинные облигации ведут себя по-разному при изменении ставки
      - title: Корреляция и общий риск
        points:
          - Диверсификация работает, когда активы реагируют на разные факторы
          - В кризис корреляции растут — защита слабеет именно тогда, когда нужна
          - Один драйвер (например, ставка) может тянуть вниз весь портфель независимо от числа бумаг
          - Системный риск снижается только через классы активов и валюты, а не через количество тикеров
      - title: Концентрация
        points:
          - Крупнейшая позиция задаёт судьбу портфеля сильнее, чем средняя доходность остальных
          - Пять бумаг одного сектора — это одна отраслевая ставка с иллюзией выбора
          - Фонд — тоже позиция: смотрите состав фонда, а не только его название
          - Концентрация допустима как осознанное решение с заранее принятым лимитом потерь
      - title: Ребалансировка
        points:
          - Правило заранее: по календарю или по отклонению доли от целевой
          - Ребалансировка заставляет продавать выросшее и покупать просевшее — это дисциплина, а не прогноз
          - Учитывайте налоги и издержки: слишком частые сделки уменьшают результат
          - Новые деньги удобнее направлять в отстающие доли, а не продавать выросшие
    pitfalls:
      - Считать число бумаг диверсификацией, игнорируя секторы
      - Держать облигации одного эмитента и считать это защитой
      - Ребалансировать на каждом движении рынка
      - Дублировать одну и ту же ставку через фонд и отдельные бумаги
    sections: [verdict, macro]
    sectors: []
    keywords: [диверсификация, концентрация, риск, корреляция, доля, ребалансировка, структура, просадка]
    sources:
      - Бертон Малкиел, «Случайная прогулка по Уолл-стрит»
      - Гарри Марковиц — портфельная теория, базовая работа о корреляциях
      - Говард Маркс, «О самом важном» — про риск и циклы
