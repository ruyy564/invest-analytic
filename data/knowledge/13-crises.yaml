# Тема: кризисы и поведение эмитентов.
# Дополняет 08-history: там хронология, здесь — кто как себя вёл и что проверять заранее.
version: 1
topics:
  - id: crises
    title: Кризисы и поведение эмитентов
    summary: В кризис падают почти все, но восстанавливаются по-разному — выживают компании с низким долгом, длинным долгом и устойчивым спросом; признаки уязвимости видны в отчётности до обвала.
    points:
      - В кризис сначала падают самые ликвидные бумаги — их продают, чтобы закрыть маржу и вернуть деньги
      - Компании с валютной выручкой и низким долгом чувствуют себя лучше при девальвации
      - Экспортёры выигрывают от слабого рубля, импортёры и ритейл с импортным ассортиментом — проигрывают
      - Банки страдают от роста плохих долгов и переоценки портфелей, но выигрывают от высокой ставки по кредитам
      - Девелоперы и лизинговые компании уязвимы к ставке и к доступу к финансированию
      - Компании с коротким долгом и близкими офертами теряют доступ к рефинансированию первыми
      - Дивиденды в кризис сокращают первыми те, у кого выплаты не покрыты денежным потоком
      - Рынок восстанавливается раньше экономики, но не все бумаги возвращаются к прежним уровням
      - Кризис меняет структуру рынка — лидеры следующего цикла часто не совпадают с лидерами прошлого
      - Реакция политики — ставка, ликвидность, поддержка секторов — определяет скорость восстановления
    details:
      - title: Кризис 1998 года
        points:
          - Дефолт по внутреннему долгу и девальвация обрушили банковскую систему
          - Банки с валютными обязательствами и коротким фондированием не выжили без реструктуризации
          - Экспортёры сырья восстановились быстрее благодаря слабому рублю
          - Урок — валютный и долговой риск реализуются одновременно
      - title: Кризис 2008 года
        points:
          - Начался с ипотечных бумаг и перерос в глобальную рецессию и падение сырья
          - Банки, девелоперы и металлурги с высоким долгом пострадали сильнее всех
          - Ритейл и компании с рублевой выручкой прошли кризис мягче
          - Урок — кредитное плечо усиливает падение и удлиняет восстановление
      - title: 2014 год
        points:
          - Санкции, ослабление рубля и резкий рост ставки ударили по банкам и потребительскому сектору
          - Компании с валютной выручкой получили выигрыш от переоценки
          - Рост ставки сделал облигации с фиксированным купоном убыточными в цене
          - Урок — внешние ограничения меняют доступ к капиталу и оборудованию
      - title: Обвал 2020 года
        points:
          - Самое быстрое падение и короткое восстановление за счёт поддержки ликвидности
          - Технологии и ритейл восстановились первыми, цикличные — позже
          - Компании с высокой долей заёмных средств и слабым потоком остались внизу дольше
          - Урок — скорость реакции политики определяет скорость возврата рынка
      - title: 2022 год
        points:
          - Закрытие части внешних рынков и перестройка структуры владения и расчётов
          - Восстановление бумаг шло неравномерно, часть активов была заморожена
          - Появились замещающие облигации и новые правила расчётов
          - Урок — страновой и инфраструктурный риск нельзя диверсифицировать внутри одного рынка
      - title: Что проверять заранее
        points:
          - Долг к EBITDA, график погашения и долю короткого долга
          - Покрытие процентов операционной прибылью
          - Долю валютной выручки и валютных обязательств
          - Зависимость от одного поставщика, рынка или покупателя
          - Историю дивидендов и их покрытие денежным потоком
          - Ликвидность акций — насколько быстро можно выйти без потери цены
    pitfalls:
      - Покупать «подешевевшие» бумаги с высоким долгом в расчёте на быстрый отскок
      - Считать, что кризис всегда короткий, потому что прошлый был коротким
      - Усреднять падающую позицию без проверки бизнеса и долга
      - Держать плечо, рассчитывая пересидеть просадку
      - Оценивать риск по прошлой волатильности, не глядя на долг и ликвидность
    sections: [macro, verdict, opinions]
    sectors: []
    keywords: [кризис, обвал, дефолт, девальвация, санкции, просадка, рецессия, восстановление, риск, ставка]
    sources:
      - Чарльз Киндлбергер, «Мировые финансовые кризисы»
      - Говард Маркс, «О самом важном» — про циклы и риск
      - Рэй Далио, «Большие долговые кризисы»
