# Тема: как макрофакты доходят до активов — цепочки трансмиссии.
version: 1
topics:
  - id: macro-transmission
    title: Макро-трансмиссия: от факта до актива
    summary: Макрофакты влияют на цены не напрямую, а через цепочку «инфляция — ставка — кредит — спрос — оценка», и именно эту цепочку нужно объяснять инвестору.
    points:
      - Цены на топливо и продукты формируют недельную инфляцию, инфляция — ожидания по ставке, ставка — доходности облигаций и оценку акций роста
      - Дефицит бюджета означает больше заимствований: растёт предложение ОФЗ, доходности и ставки держатся выше
      - Слабый рубль дорожает импорт, усиливает инфляцию и удерживает ставку высокой дольше, чем ждали
      - Снижение ставки уменьшает доходность депозитов и облигаций и переоценивает акции с длинным горизонтом роста
      - Жёсткая ставка дорожает кредит: слабеет спрос, страдают застройщики, ритейл и лизинговые компании
      - Одна и та же макроновость по-разному бьёт по секторам: банкам — маржа, застройщикам — ипотека, экспортёрам — курс
      - Инфляция и ставка влияют на оценки через дисконт, поэтому эффект сильнее у компаний, где прибыль ждут далеко в будущем
      - Рынок часто отыгрывает ожидание раньше факта: реакция на само решение бывает обратной
    details:
      - title: Цепочка «топливо — инфляция — ставка»
        points:
          - Падение цен на бензин снижает недельную инфляцию и годовую динамику
          - Замедление инфляции даёт регулятору повод смягчить риторику, затем и ставку
          - Ожидание смягчения двигает облигации и акции раньше самого решения
          - Для инвестора это означает: длинные облигации и истории роста чувствительнее к такому сигналу
      - title: Бюджет и госдолг
        points:
          - Расширение дефицита увеличивает выпуск ОФЗ и конкуренцию за деньги инвесторов
          - Давление на доходности гособлигаций поднимает планку доходности для корпоратов
          - Налоговые изменения меняют денежные потоки компаний: эффект виден в марже, а не только в настроении
          - Рост расходов поддерживает внутренний спрос: выигрывают те, кто продаёт внутри страны
      - title: Курс и импорт
        points:
          - Слабый рубль повышает цены импортных товаров и разгоняет инфляцию
          - Экспортёрам слабый рубль помогает, но пошлины и налоги срезают эффект
          - Компании с валютным долгом платят больше по обслуживанию
          - Импортёры и ритейл перекладывают курс в цены с задержкой, маржа сжимается первой
      - title: Кредит и спрос
        points:
          - Ставка определяет стоимость ипотеки, автокредита и кредита бизнесу
          - Дорогой кредит снижает продажи застройщиков, лизинга и дорогих товаров
          - Замедление спроса сказывается на выручке раньше, чем на отчётности
          - Снижение ставки возвращает спрос с лагом в несколько кварталов
    pitfalls:
      - Объяснять движение бумаги макрофактором, который не связан с её выручкой
      - Ждать мгновенной реакции цены на решение регулятора
      - Игнорировать лаг между ставкой и спросом
      - Считать инфляцию только денежным явлением, не глядя на топливо, курс и бюджет
    sections: [macro, verdict]
    sectors: []
    keywords: [инфляция, дефляция, ключевая ставка, бюджет, дефицит, курс, кредит, спрос, офз, дисконт]
    sources:
      - Стратегии Т-Инвестиций: сценарии по инфляции, ставке и бюджету
      - Рэй Далио, «Большие циклы» — долг, ставка и циклы
