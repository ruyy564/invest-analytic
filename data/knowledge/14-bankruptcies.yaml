# Тема: банкротства, санации и признаки слабости бизнеса.
# Примеры исторические: они нужны для понимания механики, а не как оценка текущих бумаг.
version: 1
topics:
  - id: bankruptcies
    title: Банкротства и признаки слабости бизнеса
    summary: Банкротство почти всегда видно заранее — за год-два до события в отчётности появляются растущий долг при падающей EBITDA, отрицательный поток и оговорки аудитора; редко причиной становится одно событие.
    points:
      - Причина банкротства почти всегда одна — не хватило денег на обязательства в срок
      - Растущий долг при падающей операционной прибыли — самый ранний признак проблемы
      - Отрицательный свободный поток несколько периодов подряд означает, что бизнес финансируют кредиторы
      - Короткий долг под длинные активы создаёт риск рефинансирования при росте ставки
      - Оговорка аудитора, смена аудитора и задержки отчётности — формальные сигналы риска
      - Сделки со связанными сторонами могут выводить деньги из компании до банкротства
      - Залоги по всем активам и ковенанты ограничивают возможности договориться с кредиторами
      - Банкротство акционеров обычно не защищает: акции обнуляются раньше, чем кредиторы получают своё
      - Облигации без обеспечения могут вернуть часть номинала, но процесс занимает годы
      - Спасает не размер компании, а структура долга и предсказуемость выручки
    details:
      - title: Известные истории
        points:
          - Enron — сокрытие долгов через связанные структуры и непрозрачная отчётность привели к краху
          - Lehman Brothers — ипотечные активы и высокое кредитное плечо сделали падение необратимым
          - Wirecard — фиктивные активы в отчётности и слабый аудит привели к обнулению стоимости
          - Трансаэро — быстрый рост долга и парка при слабом денежном потоке закончился банкротством
          - Банк Югра — отзыв лицензии и последующая санация показали риск концентрации и непрозрачности
          - Открытие — санация через средства ЦБ сохранила банк, но акционеры потеряли капитал
          - Мечел — высокая долговая нагрузка при слабом рынке стали привела к реструктуризации долга
          - Девелоперы с высокой долей проектного долга проходили кризисы тяжелее остальных
      - title: Признаки уязвимости в отчётности
        points:
          - Долг растёт быстрее выручки два и более периодов подряд
          - EBITDA падает, а проценты к уплате растут
          - Операционный поток отрицательный при положительной прибыли
          - Дебиторская задолженность растёт быстрее выручки
          - Капитальные затраты финансируются новыми кредитами, а не потоком
          - Ковенанты близки к нарушению, компания просит waivers
          - Аудитор меняется без объяснений или выдаёт оговорку
          - Отчётность задерживается, компания переносит раскрытие
          - Дивиденды платятся из заёмных средств при слабом потоке
      - title: Что происходит с бумагами
        points:
          - Акции при банкротстве обычно обнуляются или размываются допэмиссией
          - Облигации восстанавливаются в зависимости от залога и очереди требований
          - Субординированные инструменты страдают первыми, иногда полностью
          - Реструктуризация часто превращает долг в акции с потерей стоимости
          - Ликвидность исчезает раньше цены: продать бумагу становится невозможно
          - Санация банка может сохранить вклады, но не стоимость акций
      - title: Как снижать риск
        points:
          - Ограничивать долю одной бумаги и одного эмитента
          - Проверять структуру долга и график погашения до покупки
          - Не покупать «дешёвые» бумаги с высокой долговой нагрузкой без плана
          - Смотреть на рейтинги и отчёты рейтинговых агентств как на дополнительный сигнал
          - Держать облигации разных эмитентов и разных сроков
          - Читать примечания о ковенантах, залогах и связанных сторонах
    pitfalls:
      - Считать, что крупная компания не может обанкротиться
      - Покупать акции упавшего эмитента «на дне» без проверки долга
      - Держать всю позицию в одном эмитенте ради повышенного купона
      - Игнорировать аудиторские оговорки и задержки отчётности
      - Рассчитывать на возврат номинала облигации при отсутствии залога
    sections: [securities, opinions, verdict]
    sectors: []
    keywords: [банкротство, банкрот, санация, дефолт, реструктуризация, долг, риск, облигации, аудит, ковенанты]
    sources:
      - Бенджамин Грэм, «Разумный инвестор» — о рисках и защите капитала
      - Говард Шилт, «Как читать финансовые отчёты» — о признаках манипуляций
      - Отчёты рейтинговых агентств о кредитном качестве эмитентов
