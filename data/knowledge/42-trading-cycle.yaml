# Тема: инфраструктура биржевой сделки (Академия Т-Инвестиций).
version: 1
topics:
  - id: trading-cycle
    title: Как проходит биржевая сделка
    summary: За сделкой стоит цепочка «брокер — риск-сервер — биржа — клиринг — депозитарий»; понимание цепочки объясняет, где учитываются бумаги и как доходят дивиденды.
    points:
      - Заявка инвестора идёт в брокера, проходит риск-сервер и только затем попадает на биржу
      - Риск-сервер проверяет обеспечение и лимиты до отправки заявки
      - После сделки back-office и клиринговая организация (НКЦ) проводят расчёты
      - Учёт прав на бумаги ведёт депозитарий, а не брокер: бумаги остаются у владельца при проблемах брокера
      - Эмитент узнаёт владельцев через цепочку депозитариев и регистратора
      - Дивиденды идут по этой же цепочке: от эмитента к регистратору, депозитарию и счёту инвестора
      - Поэтому дата отсечки и дата выплаты — разные события: между ними проходит время на расчёты
      - В США часть брокеров зарабатывает на передаче клиентских заявок маркетмейкерам
    details:
      - title: Путь заявки
        points:
          - Инвестор выставляет заявку в приложении брокера
          - Риск-сервер проверяет деньги, бумаги и лимиты
          - Биржа сводит заявки в стакан и заключает сделку
          - Клиринг определяет обязательства сторон
          - Расчёты и поставка бумаг завершают сделку
      - title: Где учитываются бумаги
        points:
          - Права фиксируются в депозитарии, инвестор видит их на счёте депозитария
          - Брокер — посредник, а не владелец бумаг клиента
          - При смене брокера бумаги переводятся между депозитариями
          - Регистратор ведёт реестр владельцев по поручению эмитента
      - title: Дивиденды и выплаты
        points:
          - Дата отсечки определяет, кто получит выплату
          - Расчёты занимают несколько дней
          - Налог удерживает брокер как налоговый агент
          - Задержка выплаты — нормальное явление в цепочке, а не ошибка
      - title: Что из этого следует инвестору
        points:
          - Выбирать брокера стоит по надёжности и тарифам, а не только по приложению
          - Учитывать сроки расчётов при планировании сделок
          - Понимать, что дивиденды придут позже отсечки
          - Проверять, где учитываются бумаги при переводе активов
    pitfalls:
      - Считать брокера владельцем бумаг
      - Планировать покупку на дату отсечки без учёта расчётов
      - Ждать дивиденды в день отсечки
      - Игнорировать тарифы и сроки перевода активов
    sections: [verdict, macro]
    sectors: [финансы]
    keywords: [сделка, брокер, биржа, депозитарий, регистратор, клиринг, нкц, нрд, риск-сервер, дивиденды, отсечка, расчёты]
    sources:
      - Т-Инвестиции, «Как проходит полный цикл биржевой сделки»
