# Тема: ФРС и её ставка — как решения американского регулятора доходят до рынков.
version: 1
topics:
  - id: fed-policy
    title: ФРС и ставка
    summary: ФРС задаёт цену денег в долларах, а через неё — доходности мировых облигаций, курс доллара, сырьё и аппетит к риску, включая российский рынок.
    points:
      - ФРС — центральный банк США с 1913 года, независим от правительства и президента
      - Двойной мандат: максимальная занятость и стабильно низкая инфляция
      - ФРС держит не одну ставку, а целевой диапазон; в отличие от ЦБ РФ, ориентир задаётся коридором
      - Ключевой инструмент — операции на открытом рынке: покупка и продажа гособлигаций банкам
      - Эффективная ставка по федеральным фондам — ориентир цены денег; российский аналог — RUONIA
      - Ставка задаёт доходность трежерис: выше ставка — привлекательнее облигации и хуже акциям
      - Через доллар ставка влияет на сырьё и валюты развивающихся рынков, включая рубль
      - Рынок отыгрывает ожидания до заседания, поэтому реакция на сам факт может быть обратной
    details:
      - title: Как читать заседание ФРС
        points:
          - Смотреть на консенсус и на фьючерсы FedWatch — какие вероятности заложены
          - Голоса членов комитета важны: разногласия говорят о неопределённости
          - Тон заявления и пресс-конференции меняет ожидания сильнее самого решения
          - Реакция рынка облигаций (доходности) показательнее реакции акций
      - title: Каналы влияния на российский рынок
        points:
          - Курс доллара и через него — импортные цены и инфляция
          - Мировые цены на сырьё и нефть, а значит выручка экспортёров
          - Глобальный аппетит к риску: при дорогих деньгах инвесторы уходят из рисковых активов
          - Ставки по внешним заимствованиям и доступность капитала
      - title: Что важно помнить
        points:
          - Решение ФРС не отменяет локальную историю бумаги
          - Влияние идёт с лагом и через несколько каналов одновременно
          - Ожидания рынка часто важнее факта
          - Для российского инвестора важен не только факт, но и риторика
      - title: Пример реакции рынка
        points:
          - Сохранение ставки при ожиданиях повышения — это сигнал «мягче ожиданий»
          - Рост доходностей длинных трежерис давит на оценки акций роста
          - Разногласия внутри ФРС повышают волатильность на всех рынках
          - Нефть и инфляция — главные аргументы в решениях последних лет
    pitfalls:
      - Делать вывод по акции только из решения ФРС
      - Игнорировать ожидания, заложенные в цены
      - Путать ставку ФРС и ставку ЦБ РФ
      - Считать решение окончательным: цикл ставок длинный
    sections: [macro, verdict]
    sectors: []
    keywords: [фрс, ставка, доллар, трежерис, fedwatch, ruonia, инфляция, занятость, сырьё, аппетит к риску]
