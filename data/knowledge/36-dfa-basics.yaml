# Тема: цифровые финансовые активы (ЦФА) — по материалам Академии Т-Инвестиций.
version: 1
topics:
  - id: dfa-basics
    title: Цифровые финансовые активы
    summary: ЦФА дают доступ к недвижимости, металлам, кредитным портфелям и венчурным проектам через блокчейн-инструменты, но добавляют риски платформы и ликвидности.
    points:
      - ЦФА — инструменты на блокчейне, которые представляют права на актив: недвижимость, драгоценные металлы, кредитные портфели банков, венчурные проекты
      - Отличие от акций и облигаций — в форме выпуска и учёте: права фиксируются в информационной системе, а не в классическом депозитарии
      - Отличие от криптовалюты — в обеспечении: ЦФА привязаны к конкретному активу или денежному потоку и выпускаются по правилам регулятора
      - Компании выбирают ЦФА для привлечения капитала быстрее и дешевле, чем через классический выпуск
      - Часть выпусков доступна только квалифицированным инвесторам — проверьте статус до покупки
      - Риск платформы: обращение и учёт зависят от оператора информационной системы
      - Риск ликвидности: узкий круг покупателей, досрочный выход может быть дорогим
      - Бывают технические дефолты: невыполнение обязательств оператором или эмитентом, а не только бизнесом
      - Для покупки обычно нужен смарт-счёт у брокера или платформы
    details:
      - title: Что дают ЦФА
        points:
          - Доступ к активам, которыми сложно владеть напрямую: недвижимость, металл, кредитный портфель
          - Более короткий путь привлечения денег для эмитента
          - Потенциально более высокая доходность за счёт риска и нестандартности
          - Разные схемы выплат: купон, дисконт, доля в денежном потоке
      - title: На что смотреть при выборе
        points:
          - Кто эмитент и чем обеспечен выпуск
          - Кто оператор платформы и как учитываются права
          - Срок, график выплат, условия досрочного выхода
          - Требуется ли статус квалифицированного инвестора
          - Ликвидность и возможность продать до погашения
      - title: Риски
        points:
          - Кредитный риск эмитента и риск обеспечения
          - Риск оператора информационной системы
          - Технологический риск: сбои, ошибки учёта
          - Регуляторный риск: правила рынка молодые и меняются
          - Низкая ликвидность и непрозрачная цена
      - title: Кому подходит
        points:
          - Инвестору с опытом, который понимает риск нестандартных активов
          - Как небольшая доля портфеля, а не основа стратегии
          - Квалифицированным инвесторам для части выпусков
          - Не подходит, если нужны гарантированная ликвидность и прозрачная цена
    pitfalls:
      - Считать ЦФА аналогом акций или облигаций без анализа эмитента
      - Путать ЦФА с криптовалютой
      - Игнорировать риск оператора платформы
      - Вкладывать в один выпуск существенную долю портфеля
    sections: [verdict, macro]
    sectors: []
    keywords: [цфа, цифровые финансовые активы, блокчейн, смарт-счёт, эмитент, оператор, ликвидность, квалифицированный инвестор]
    sources:
      - Т-Инвестиции, «Как устроены цифровые финансовые активы»
