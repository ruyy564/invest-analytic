# Тема: брокер — что он делает, на чём зарабатывает, как перевести активы.
version: 1
topics:
  - id: broker-basics
    title: Брокер и перевод активов
    summary: Брокер — посредник доступа к бирже, который зарабатывает не только на комиссии за сделку; бумаги при этом учитываются в депозитарии, поэтому их можно перевести к другому брокеру.
    points:
      - Брокер даёт доступ к бирже, но бумаги клиента хранятся не у него, а в депозитарии
      - Комиссия за сделку — лишь один из источников дохода брокера
      - Брокеры зарабатывают на маржинальном кредитовании, сделках с бумагами, предоставлении активов в долг и инвестиционных продуктах
      - Часть дохода — за поддержание ликвидности и обслуживание счетов
      - В США многие брокеры отменили комиссии, но зарабатывают на передаче заявок маркетмейкерам и на других услугах
      - Для клиента важны не только тарифы, но и надёжность, набор инструментов и качество исполнения
      - Перевести бумаги к другому брокеру можно: с сентября работает быстрый перевод через инфраструктуру биржи
      - Быстрый перевод по регламенту ЦБ занимает до 25 минут и проходит в рабочие часы депозитария
      - За перевод платится комиссия вышестоящего депозитария, она зависит от числа бумаг и ISIN
      - Отчёт о расходах на покупку нужно передать новому брокеру — иначе при продаже НДФЛ удержат со всей суммы
    details:
      - title: На чём зарабатывает брокер
        points:
          - Комиссия за сделки и за обслуживание счёта
          - Маржинальное кредитование: проценты за заёмные средства
          - Сделки за свой счёт и поддержание ликвидности
          - Предоставление бумаг в долг (сделки РЕПО)
          - Инвестиционные продукты и управление
      - title: Что важно клиенту
        points:
          - Тарифы: сделки, обслуживание, вывод, перевод бумаг
          - Надёжность и учёт бумаг в депозитарии
          - Набор доступных инструментов и рынков
          - Качество исполнения и поддержка
      - title: Перевод активов
        points:
          - Сначала обновить приложение и включить зачисление на счёт получателя
          - В приложении старого брокера выбрать «быстрый перевод себе»
          - Указать бумаги и количество, подтвердить условия
          - Учесть комиссию: за поручение и за каждую бумагу по ISIN
          - Передать отчёт о расходах новому брокеру для корректного НДФЛ
      - title: Подводные камни
        points:
          - Купленные бумаги недоступны для перевода до завершения расчётов
          - Быстрый перевод работает только в рабочие часы депозитария
          - Без отчёта о расходах налог посчитают со всей суммы продажи
          - Часть бумаг может не поддерживаться быстрым переводом — тогда старый алгоритм дольше
    pitfalls:
      - Считать брокера владельцем бумаг
      - Выбирать брокера только по размеру комиссии
      - Забыть про отчёт о расходах при переводе
      - Переводить бумаги сразу после покупки, не дождавшись расчётов
    sections: [verdict, macro]
    sectors: [финансы]
    keywords: [брокер, комиссия, маржинальное кредитование, депозитарий, перевод активов, moex мост, нрд, isin, отчёт о расходах]
    sources:
      - Т-Инвестиции, «Как устроен бизнес брокера и на чём он зарабатывает»
      - Т-Инвестиции, «Как перевести активы от одного брокера к другому»
