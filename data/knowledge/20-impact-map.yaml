# Тема: карта влияния макрофакторов на секторы — механизм, а не лозунг.
version: 1
topics:
  - id: impact-map
    title: Как макрофакторы влияют на бумаги
    summary: У каждого сектора свой набор драйверов — ставка, курс, сырьё, тарифы, спрос; влияние всегда идёт через выручку, издержки, долг и ставку дисконтирования.
    points:
      - Рост ключевой ставки повышает стоимость денег: дороже долг, выше требуемая доходность, ниже оценка будущей прибыли
      - Банки выигрывают от высокой ставки на коротком отрезке через процентную маржу, но платят качеством кредита позже
      - Застройщики и лизинговые компании зависят от ставки и ипотеки: дорогая ипотека бьёт по продажам, слабый рубль — по себестоимости
      - Экспортёры нефти, газа и металлов выигрывают от слабого рубля и мировых цен, но платят экспортными пошлинами и налогами
      - Импортёры и ритейл чувствуют курс через закупку и логистику; защита — рост цен, но он давит на спрос
      - Слабый рубль разгоняет инфляцию, а инфляция удерживает ставку высокой — это замкнутый круг для внутреннего спроса
      - Тарифные и регулируемые компании зависят от решения регулятора больше, чем от рынка
      - Компании с низким долгом переживают высокую ставку легче — это их относительное преимущество в фазе ужесточения
    details:
      - title: Механизмы по секторам
        points:
          - Нефть и газ: мировые цены, курс, налоги и пошлины, санкции и логистика; маржа зависит от экспортной альтернативы
          - Металлы и удобрения: мировые цены и курс; внутренний спрос и пошлины; цикличность сильнее дивидендов
          - Банки: ставка, кривая доходности, качество кредита, достаточность капитала, регуляторные требования
          - Девелопмент: ипотечная ставка, льготные программы, цены на жильё, себестоимость стройки, распроданность
          - Ритейл: реальные доходы, инфляция, трафик, конкуренция и давление на маржу
          - Технологии и медиа: инвестиции в развитие, ставка дисконтирования, регуляторика и конкуренция
          - Электроэнергетика: тарифы, топливные затраты, износ сетей, инвестпрограмма
          - Транспорт: тарифы, объёмы перевозок, топливо и логистические ограничения
      - title: Как использовать
        points:
          - Определите 2–3 драйвера, которые реально формируют деньги этой компании
          - Проверьте, куда движется каждый драйвер сейчас, а не «в целом»
          - Оцените, что уже в цене: рынок часто отыгрывает фактор заранее
          - Свяжите драйвер с отчётностью: где он виден — выручка, маржа, долг
      - title: Ставка: цепочка влияния
        points:
          - Выше ставка — дороже обслуживание долга и выше требуемая доходность, оценка снижается
          - Банки получают маржу раньше, чем платят за риск кредита: эффект несимметричен во времени
          - Застройщик чувствует ставку через ипотеку и продажи, а не через собственный долг напрямую
          - Длинные облигации и «длинные» истории роста страдают от ставки больше остальных
      - title: Курс: кто выигрывает и кто платит
        points:
          - Экспортёр выигрывает от слабого рубля, если издержки в рублях, а выручка в валюте
          - Импортёр платит курсом: закупка дорожает быстрее, чем получается поднять цены
          - Внутренний спрос слабеет, когда слабый рубль разгоняет инфляцию и ставку
          - Хеджирование и валютный долг меняют знак эффекта: проверяйте структуру баланса
    pitfalls:
      - Называть «нефть» драйвером компании, у которой нет экспортной выручки
      - Оценивать влияние ставки без учёта долга компании
      - Считать слабый рубль однозначно хорошим для всех экспортёров
      - Забывать про пошлины, налоги и логистику, которые съедают эффект курса
    sections: [opinions, verdict, macro]
    sectors: []
    keywords: [ставка, курс, рубль, нефть, газ, металлы, тариф, ипотека, спрос, инфляция, драйвер, механизм]
    sources:
      - Рэй Далио, «Большие циклы» — про ставку, долг и циклы
      - Практика макрообзоров инвест-домов: фактор, механизм, следствие
