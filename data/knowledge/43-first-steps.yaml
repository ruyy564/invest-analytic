# Тема: первые шаги на рынке акций (Академия Т-Инвестиций).
version: 1
topics:
  - id: first-steps
    title: Первые шаги на рынке акций
    summary: На акциях зарабатывают двумя способами — ростом цены и дивидендами; разница между компаниями роста и стоимости и понимание дивидендного гэпа важнее выбора «лучшей» бумаги.
    points:
      - Два источника дохода: рост стоимости акции и дивиденды; стратегии под них разные
      - Акции дают потенциально более высокую доходность, чем облигации, но и больший риск и срок
      - IPO — выход компании на биржу для привлечения капитала; цена размещения не гарантирует роста
      - Компании роста вкладывают прибыль в развитие, компании стоимости возвращают её акционерам
      - Дивиденды получает тот, кто купил до даты отсечки; с учётом расчётов покупать нужно заранее
      - В дату отсечки цена падает примерно на размер дивиденда — это дивидендный гэп
      - Гэп закрывается не всегда: зависит от спроса и ожиданий, иногда не закрывается годами
      - Начинать лучше с понятного бизнеса и небольшой доли капитала
    details:
      - title: Рост против стоимости
        points:
          - Рост: высокая динамика, реинвестирование прибыли, выше волатильность
          - Стоимость: зрелый бизнес, дивиденды и выкуп акций, ниже темпы
          - Дешёвая бумага стоимости может быть ловушкой, если прибыль падает
          - Дорогая бумага роста может быть оправдана, если рост устойчив
      - title: Дивиденды без иллюзий
        points:
          - Дивиденд — часть прибыли, а не бонус сверху
          - Высокая доходность по дивидендам часто означает падающую цену
          - Устойчивость выплат важнее размера
          - Налог удерживается при выплате
      - title: С чего начать
        points:
          - Начать с подушки и целей, а не с покупки акций
          - Выбирать бизнес, который понятен
          - Держать небольшой размер позиции на старте
          - Сравнивать с простым ориентиром: индекс или депозит
      - title: Типичные ошибки новичка
        points:
          - Покупать на слухах и «сигналах» из чатов
          - Концентрировать весь капитал в одной идее
          - Усреднять падающую бумагу без анализа
          - Оценивать результат по одной неделе
    pitfalls:
      - Путать доходность по дивидендам с полной доходностью
      - Покупать в дату отсечки, не учитывая расчёты
      - Считать IPO гарантией роста
      - Начинать без подушки и целей
    sections: [opinions, verdict]
    sectors: []
    keywords: [акции, ipo, рост, стоимость, дивиденды, отсечка, дивидендный гэп, новичок, риск, облигации]
    sources:
      - Т-Инвестиции, «Как сделать первые шаги на рынке акций»
