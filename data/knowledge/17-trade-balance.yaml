# Тема: внешнеэкономический профиль — экспортёры, импортёры и внутренний рынок.
# Дополняет 02-macro (ставка, инфляция, курс) и 06-sectors (зависимости секторов).
version: 1
topics:
  - id: trade-balance
    title: Экспортёры, импортёры и внутренний рынок
    summary: У каждой бумаги своя связка с внешним миром — экспортёр зарабатывает в валюте, импортёр платит валютой за себестоимость, внутренний бизнес зависит от доходов и ставки; структура портфеля по этим трём группам объясняет, что с ним будет при изменении курса.
    points:
      - Экспортёр выигрывает от слабого рубля, если издержки рублёвые, а выручка валютная
      - Импортёр и ритейл с импортным ассортиментом проигрывают от слабого рубля — растёт себестоимость
      - Внутренний бизнес зависит от реальных доходов, ставки и тарифов, а не от мировых цен
      - Валютный долг меняет знак выгоды — девальвация бьёт по компаниям с валютными обязательствами
      - Экспортные пошлины и демпфер перераспределяют выгоду от высоких цен между компанией и бюджетом
      - Профицит платёжного баланса поддерживает рубль, отток капитала и импорт — давят на него
      - Портфель из одних экспортёров — это ставка на сырьё и слабый рубль, а не диверсификация
      - Портфель из одних внутренних бумаг зависит от ставки и доходов сильнее, чем от внешних рынков
      - Санкции и логистика влияют на экспортёров через скидки к мировой цене и пути поставок
      - Баланс групп важнее точного прогноза курса — он задаёт, какой сценарий портфель переживёт хуже
    details:
      - title: Экспортёры
        points:
          - Нефтегаз, металлы и добыча, удобрения, лес и часть агросектора
          - Выручка привязана к мировым ценам, издержки в основном рублёвые
          - Слабый рубль увеличивает рублёвую выручку при том же физическом объёме
          - Высокие цены сырья дают максимум прибыли, низкие — сжимают маржу и дивиденды
          - Пошлины и налоговый режим могут забрать часть выгоды от роста цен
          - Валютный долг и лизинг оборудования частично гасят выгоду от девальвации
      - title: Импортёры и потребительский сектор
        points:
          - Ритейл, электроника, автодилеры и компании с высокой долей импортного ассортимента
          - Слабый рубль повышает закупочную цену и сжимает маржу, если цены не удаётся поднять
          - Логистика и пошлины добавляют к себестоимости не меньше, чем сам курс
          - Спрос зависит от реальных доходов и потребительского кредита
          - Высокая ставка охлаждает спрос быстрее, чем компании успевают переложить издержки в цену
      - title: Внутренний рынок
        points:
          - Банки, телеком, электроэнергетика, ЖКХ, девелопмент, внутренние услуги
          - Выручка рублёвая, поэтому курс влияет через издержки и импортное оборудование
          - Банки зависят от ставки, качества портфеля и спроса на кредит
          - Тарифные отрасли зависят от регулирования: рост издержек не всегда переносится в тариф
          - Девелопмент зависит от ипотечной ставки и льготных программ
      - title: Что смотреть в портфеле
        points:
          - Долю экспортёров, внутреннего рынка и импортёров по стоимости
          - Долю валютной выручки и валютного долга
          - Чувствительность к ставке: у кого дорожает обслуживание долга
          - Концентрацию в одном сценарии — например, всё в сырье и слабом рубле
          - Наличие защитных групп при смене курса или ставки
    pitfalls:
      - Считать всех экспортёров одинаково выигрывающими от девальвации
      - Игнорировать импортную составляющую себестоимости у «внутренних» компаний
      - Оценивать портфель без учёта валютного долга эмитентов
      - Делать ставку на курс через одну бумагу вместо структуры
      - Путать выручку в валюте с прибылью в валюте
    sections: [macro, verdict, opinions]
    sectors: []
    keywords: [экспортер, экспортёр, импортер, импортёр, экспорт, импорт, курс, рубль, девальвация, платежный баланс, пошлина, демпфер, валютная выручка]
    sources:
      - Рэй Далио, «Большие долговые кризисы» — о платежных балансах
      - Обзоры Банка России о платежном балансе и курсовой динамике
      - Говард Маркс, «О самом важном» — о сценариях и риске
