# Тема: стратегии на акциях и облигациях.
# Принципы и механика; конкретные пропорции зависят от цели, горизонта и риска инвестора.
version: 1
topics:
  - id: strategies
    title: Стратегии на акциях и облигациях
    summary: Стратегия — это правило, по которому принимаются решения, а не набор идей; у каждой есть цена ошибки, и её проверяют на горизонте, а не по последним сделкам.
    points:
      - Любая стратегия должна отвечать на вопросы что покупать, когда продавать и сколько риска допускать
      - Индексная стратегия выигрывает у большинства активных за счёт низких издержек и отсутствия ошибок выбора
      - Дивидендная стратегия работает, только если дивиденды покрыты денежным потоком и долг безопасен
      - Стоимостная стратегия требует терпения — дешёвая бумага может оставаться дешёвой годами
      - Стратегия роста опирается на будущую прибыль и уязвима к переоценке ожиданий
      - Моментум работает на коротких горизонтах и требует дисциплины выхода
      - Усреднение стоимости снижает влияние времени входа, но не спасает слабый бизнес
      - Ребалансировка возвращает портфель к целевым долям и заставляет продавать дорогое, покупать дешёвое
      - Для облигаций главные параметры — дюрация, кредитный риск и ликвидность, а не только купон
      - Лестница облигаций сглаживает ставку и обеспечивает регулярные погашения
      - Кредитный риск оплачивается спредом к ОФЗ, и он должен компенсировать вероятность дефолта
      - Флоатеры и линкеры защищают от роста ставки и инфляции, но имеют свои ограничения
    details:
      - title: Стратегии на акциях
        points:
          - Индексная — покупка широкого индекса на длинный срок с низкой комиссией
          - Дивидендная — отбор бумаг с устойчивыми выплатами и покрытием потока
          - Стоимостная — покупка компаний ниже их оценки по прибыли, активам или потоку
          - Роста — ставка на ускорение выручки и прибыли выше рынка
          - Моментум — следование сложившемуся тренду с жёстким правилом выхода
          - Усреднение — регулярные покупки фиксированной суммой независимо от цены
          - Buy and hold — долгое владение качественными компаниями без частых сделок
      - title: Правила для акций
        points:
          - Ограничивать долю одной бумаги, даже при высокой уверенности
          - Покупать только тот бизнес, который можно объяснить двумя предложениями
          - Определять условия выхода до покупки — по бизнесу, а не только по цене
          - Проверять оценку несколькими метриками, а не одним мультипликатором
          - Сравнивать результат с индексом, а не с собственными ожиданиями
      - title: Стратегии на облигациях
        points:
          - Лестница — бумаги с разными сроками погашения, чтобы не зависеть от одного момента ставки
          - Дюрация — чем она больше, тем сильнее цена реагирует на изменение ставки
          - Carry — доход за счёт купона при удержании до погашения
          - Кредитный риск — повышенный купон компенсирует вероятность дефолта эмитента
          - Флоатеры — доход привязан к ставке, цена стабильнее при её росте
          - Линкеры — защита от инфляции, но с ограниченной ликвидностью
          - Замещающие — валютный доход в рублях с особенностями расчётов и налогообложения
      - title: Правила для облигаций
        points:
          - Держать бумаги с разными сроками и разных эмитентов
          - Считать доходность к погашению, а не только купонную ставку
          - Проверять оферты, амортизацию и условия досрочного выкупа
          - Не брать высокий купон без проверки кредитного качества
          - Учитывать налог и комиссию в итоговой доходности
      - title: Риск и поведение
        points:
          - Размер позиции важнее точности идеи
          - Просадка не должна требовать изменения стратегии — только проверки исходных условий
          - Отсутствие сделок — тоже решение, если условия не выполнены
          - Стратегию меняют по фактам, а не по эмоциям после убытка
          - Результат оценивают на длинном горизонте и после издержек
    pitfalls:
      - Менять стратегию после каждой просадки
      - Считать высокий купон гарантией доходности
      - Держать весь портфель в одной идее
      - Не учитывать налоги и комиссии в расчёте результата
      - Путать стратегию с прогнозом рынка
    sections: [verdict, opinions, macro, securities]
    sectors: []
    keywords: [стратегия, стратегии, дивидендная, стоимостная, рост, моментум, усреднение, ребалансировка, индекс, лестница, дюрация, флоатер, линкер, купон, портфель]
    sources:
      - Джон Богл, «Общий фондовый индекс» — об индексной стратегии
      - Бенджамин Грэм, «Разумный инвестор» — о стоимости и запасе прочности
      - Фрэнк Фабоцци, «Рынок облигаций» — о дюрации и структуре долга
