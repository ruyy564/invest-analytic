# Тема: секьюритизация — облигации, обеспеченные кредитами (Академия Т-Инвестиций).
version: 1
topics:
  - id: securitization
    title: Облигации, обеспеченные кредитами
    summary: Секьюритизация превращает пул кредитов в облигации: доходность выше корпоративных выпусков, но и риски сложнее — качество пула, досрочное погашение и структура траншей.
    points:
      - Банк объединяет кредиты клиентов в пул и выпускает под него облигации для инвесторов
      - Обеспечение — денежные потоки заёмщиков: платежи по кредитам идут на купоны и погашение
      - Доходность обычно выше многих корпоративных выпусков, потому что структура и риск сложнее
      - Диверсификация: один выпуск даёт долю сразу в сотнях кредитов
      - Риск качества пула: если заёмщики перестают платить, денежный поток уменьшается
      - Досрочное погашение кредитов возвращает деньги раньше — реинвестировать придётся по текущим ставкам
      - Структура траншей: старшие получают выплаты первыми, младшие принимают первые убытки
      - Оценить выпуск сложнее, чем обычную облигацию: нужны данные по пулу и структуре
    details:
      - title: Как устроена сделка
        points:
          - Банк выдаёт кредиты и передаёт их в отдельную структуру
          - Структура выпускает облигации инвесторам и платит из платежей заёмщиков
          - Выплаты распределяются по очереди: сначала старшие транши, затем младшие
          - Обслуживание пула контролирует сервисный агент, отчётность регулярная
      - title: На что смотреть перед покупкой
        points:
          - Состав и качество пула: типы кредитов, просрочка, концентрация
          - Транш: старший спокойнее, младший доходнее и рискованнее
          - Кредитный рейтинг выпуска и кто его присвоил
          - Условия досрочного погашения и защиты от него
          - Ликвидность выпуска и наличие маркет-мейкера
      - title: Риски
        points:
          - Кредитный риск заёмщиков пула
          - Риск досрочного погашения при снижении ставок
          - Риск сложной структуры: не всё видно из названия
          - Риск ликвидности: выход до погашения может быть дорогим
          - Модельный риск: оценка пула опирается на статистику, а не на гарантию
      - title: Роль в портфеле
        points:
          - Часть консервативной доли с премией к обычным корпоратам
          - Несколько выпусков разных пулов вместо одного
          - Сравнивать с корпоратами того же рейтинга и срока
          - Не строить на них основу портфеля
    pitfalls:
      - Смотреть только на доходность, не читая структуру транша
      - Считать обеспечение гарантией выплат
      - Игнорировать риск досрочного погашения
      - Покупать неликвидный выпуск на короткий горизонт
    sections: [verdict, macro]
    sectors: [финансы]
    keywords: [секьюритизация, облигации, обеспеченные кредитами, пул, транш, старший, младший, досрочное погашение, рейтинг]
    sources:
      - Т-Инвестиции, «Зачем инвестору облигации, обеспеченные кредитами»
