# Тема: как копить деньги — от подушки до инвестиций (Т-Инвестиции).
version: 1
topics:
  - id: saving-basics
    title: Как копить деньги
    summary: Накопления начинаются не с рынка, а с подушки и конкретной цели; откладывать нужно процент от дохода сразу после поступления, а инструменты выбирать по сроку цели.
    points:
      - Сначала финансовая подушка на случай потери работы, болезни и срочных расходов
      - Размер подушки: обязательные месячные расходы умножить на (3 + число факторов риска)
      - Факторы риска: нерегулярный доход, нет другого источника, редкая профессия, кредиты, аренда жилья, иждивенцы
      - Второй шаг — конкретная цель по SMART: сумма, срок, ежемесячный взнос
      - Откладывать процент от дохода сразу после поступления: правило 10 процентов или схема 50/30/20
      - Краткосрочные цели и подушку держат в банковских продуктах, а не в акциях
      - Средние и длинные цели — биржевые инструменты: облигации, фонды, акции
      - Кредит вместо накоплений дороже: покупка на 150 тыс. под 20 % на год добавляет около 16,7 тыс. переплаты
    details:
      - title: Подушка
        points:
          - Считается от обязательных расходов, а не от дохода
          - Лежит в ликвидном инструменте с быстрым доступом
          - Пополняется после крупных трат
          - Не инвестируется в волатильные активы
      - title: Цель
        points:
          - Формулировка с суммой и датой: «300 тыс. к июлю, по 25 тыс. в месяц»
          - Принцип BSQ: большая цель, маленькие шаги, начать сейчас
          - Цель определяет инструмент и горизонт
          - Регулярная проверка прогресса вместо разовых рывков
      - title: Инструменты по сроку
        points:
          - До года: вклад, накопительный счёт, денежный рынок
          - Один–три года: короткие облигации, консервативные фонды
          - Три года и больше: облигации, фонды, акции по риск-профилю
          - Пенсионные и долгосрочные счета — для целей на десятилетия
      - title: Дисциплина
        points:
          - Автоматический перевод в день дохода
          - Отдельный счёт для накоплений
          - Реинвестирование дохода вместо вывода
          - Отказ от эмоциональных решений в просадке
    pitfalls:
      - Начинать инвестировать до подушки
      - Копить «на всё сразу» без цели
      - Держать краткосрочные деньги в акциях
      - Брать кредит вместо накоплений на желаемую покупку
    sections: [verdict, macro]
    sectors: []
    keywords: [накопления, подушка, цель, smart, 50/30/20, вклад, облигации, дисциплина, сбережения]
    sources:
      - Т-Инвестиции, «Как копить деньги: от финансовой подушки до инвестиций»
