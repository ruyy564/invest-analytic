# Тема: выбор акции по шагам — по мотивам образовательных материалов Т-Инвестиций.
version: 1
topics:
  - id: stock-selection
    title: Четыре шага выбора акции
    summary: Выбор акции — это четыре проверки подряд: понятность бизнеса, качество финансов, оценка и риски с катализаторами; пропуск шага делает вывод случайным.
    points:
      - Шаг 1 — понять бизнес: на чём компания зарабатывает, кто клиенты, кто конкуренты, от чего зависит выручка
      - Шаг 2 — проверить качество: рост выручки, маржа, долг, денежный поток, рентабельность капитала
      - Шаг 3 — оценить: P/E, P/B, EV/EBITDA против сектора и собственной истории, дивиденды и их устойчивость
      - Шаг 4 — риски и катализаторы: регуляторика, долг, отчётность, менеджмент, сделки, новые рынки
      - Сравнивать бумагу нужно только с аналогами: у банка и застройщика разные нормальные мультипликаторы
      - Дисконт к сектору часто отражает риск, а не подарок: сначала объясните причину, потом считайте дешёвой
      - Катализатор, которого нет в цене, — возможность; катализатор, который все ждут, — риск разочарования
      - Проверяйте, что уже в цене: сильная отчётность при ожиданиях роста может дать падение
    details:
      - title: Шаг 1. Понять бизнес
        points:
          - Источники выручки и их доли: одна или несколько линий, зависит ли от одного контрагента
          - География и валюта выручки: экспортёр или внутренний рынок, чувствительность к курсу
          - Регуляторный контур: тарифы, лицензии, госзаказ, льготы
          - Конкурентная позиция: доля рынка, барьеры входа, сила бренда
      - title: Шаг 2. Качество финансов
        points:
          - Выручка и прибыль должны расти вместе; рост выручки без прибыли — вопрос о марже
          - Долг к EBITDA ниже 2–3x считается умеренным, выше — риск при высокой ставке
          - Денежный поток важнее бумажной прибыли: проверяйте, приходит ли прибыль деньгами
          - Рентабельность капитала сравнивайте с сектором и со ставкой по депозитам
      - title: Шаг 3. Оценка
        points:
          - P/E ниже медианы сектора — повод искать причину, а не покупать сразу
          - P/B полезен для банков и капиталоёмких компаний, для сервисных — меньше
          - EV/EBITDA сравнивает компании с разным долгом, учитывает структуру капитала
          - Дивидендная доходность считается с устойчивой выплаты, а не с разовой
      - title: Шаг 4. Риски и катализаторы
        points:
          - Долг и график погашений: крупный выкуп в период высокой ставки — риск
          - Отчётность и менеджмент: задержки, смена аудитора, смена стратегии
          - Регуляторика и налоги: изменение правил меняет денежные потоки надолго
          - Катализаторы: отчёт, дивиденды, сделка, новый продукт — с датой и вероятностью
    pitfalls:
      - Покупать «дешёвую» бумагу без объяснения, почему она дешёвая
      - Сравнивать мультипликаторы компаний из разных секторов
      - Оценивать компанию по одной метрике (только дивиденды или только P/E)
      - Держать бумагу без инвалидаторов: непонятно, когда вывод стал неверным
    sections: [opinions, verdict]
    sectors: []
    keywords: [акция, бизнес, выручка, маржа, долг, денежный поток, p/e, p/b, ev/ebitda, дивиденды, катализатор, риск]
    sources:
      - Образовательные материалы Т-Инвестиций: как выбрать акцию за четыре шага
      - Бенджамин Грэм, «Разумный инвестор» — качество и оценка
