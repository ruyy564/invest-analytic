# Тема: что двигает котировки акций (Академия Т-Инвестиций).
version: 1
topics:
  - id: price-drivers
    title: Что двигает котировки акций
    summary: Акция двигается на изменении ожиданий по будущим деньгам компании, а не на самой новости; краткосрочные и долгосрочные факторы работают по-разному.
    points:
      - Долгосрочно цену двигают рост бизнеса, прибыль, снижение долга и возврат капитала акционерам (дивиденды, байбэк)
      - Краткосрочно — отчётность против ожиданий, дивидендные новости, сделки, регуляторика и общий настрой рынка
      - Сильный отчёт при завышенных ожиданиях может дать падение: рынок покупал ожидание, а не факт
      - Обратный выкуп сокращает число акций и поддерживает цену, но требует свободных денег
      - Снижение долга уменьшает риск и процентные расходы — это плюс и к прибыли, и к оценке
      - Негативные корпоративные события (размытие, долг, смена менеджмента) валят даже надёжные бумаги
      - Краткосрочные факторы дают волатильность, долгосрочные — результат; путать их — главная ошибка новичка
      - Усреднение стоимости помогает при понятном долгосрочном взгляде и вредит, если бизнес сломался
    details:
      - title: Долгосрочные факторы
        points:
          - Рост выручки и прибыли: важнее динамика, чем абсолютный уровень
          - Рентабельность и денежный поток: прибыль должна приходить деньгами
          - Долг: высокая нагрузка усиливает риск при росте ставки
          - Возврат капитала: дивиденды и байбэк при наличии свободного потока
          - Качество управления и стратегия: смена курса может переписать ожидания
      - title: Краткосрочные факторы
        points:
          - Отчётность и прогноз менеджмента — сравнение с консенсусом
          - Дивидендные объявления и даты отсечки
          - Сделки: покупка активов, продажа, реструктуризация долга
          - Регуляторика, тарифы, суды, штрафы
          - Настрой рынка и потоки: индекс страха, ставка, курс
      - title: Как читать реакцию
        points:
          - Сравнивайте движение с сектором и индексом — сила или слабость видна только в сравнении
          - Смотрите объём: движение на низком объёме быстро откатывается
          - Проверяйте, что уже в цене: ожидание часто отыграно заранее
          - Не переносите один день на год
      - title: Усреднение и фиксация
        points:
          - Усреднение работает, когда бизнес в порядке, а цена упала по рыночной причине
          - Усреднение вредит, когда причина падения — сломанная модель или долг
          - Фиксировать прибыль по заранее заданному правилу, а не по эмоциям
          - Ребалансировка становится дисциплиной вместо прогноза
    pitfalls:
      - Объяснять движение акции одной новостью без проверки ожиданий
      - Усреднять падающую бумагу с broken-кейсом
      - Путать краткосрочный шум с изменением долгосрочной истории
      - Держать позицию без условия, при котором вывод меняется
    sections: [opinions, verdict]
    sectors: []
    keywords: [котировки, акция, драйвер, отчётность, байбэк, усреднение, ожидания, дивиденды, рост, долг]
