# Тема: налоговые вычеты 2026 (Т-Инвестиции).
version: 1
topics:
  - id: tax-deductions
    title: Налоговые вычеты
    summary: Вычет уменьшает налогооблагаемый доход, и вернуть можно только уплаченный НДФЛ; в 2026 году доступны семь видов вычетов, и большинство оформляется без декларации.
    points:
      - В 2026 году доступны семь видов вычетов: стандартные, социальные, имущественные, инвестиционные, профессиональные, на долгосрочные сбережения и при переносе убытков
      - Условия: доход, облагаемый НДФЛ, статус налогового резидента, отсутствие статуса иностранного агента
      - Вычет уменьшает базу, а возврат равен уплаченному налогу с этой суммы — 13 % или больше по прогрессивной шкале
      - Прогрессивная шкала: 13 % до 2,4 млн рублей совокупного дохода, дальше 15–22 %
      - При нескольких ставках ФНС вычитает вычет «с конца» — сначала с дохода по высокой ставке, возврат больше
      - Большинство вычетов ограничены лимитом расходов, а не полной суммой трат
      - Оформляется через брокера, банк или ФНС: декларация нужна не всегда
      - Инвестиционные вычеты уменьшают НДФЛ с дохода от ценных бумаг, а не только с зарплаты
    details:
      - title: Виды вычетов
        points:
          - Стандартные — для отдельных категорий граждан и на детей
          - Социальные — лечение, обучение, спорт, благотворительность, страхование
          - Имущественные — покупка жилья и проценты по ипотеке, продажа имущества
          - Инвестиционные — взносы на ИИС и доход от продажи бумаг при длительном владении
          - Профессиональные — для ИП и частной практики
          - На долгосрочные сбережения — новый тип для долгосрочных продуктов
          - При переносе убытков — уменьшение будущей прибыли от инвестиций
      - title: Как считается возврат
        points:
          - Сначала определяется сумма вычета в пределах лимита
          - Затем она умножается на ставку НДФЛ, которая применяется к этому доходу
          - При доходе выше 2,4 млн вычет применяется к высоким ступеням шкалы
          - Возврат ограничен фактически уплаченным налогом за год
      - title: Как оформить
        points:
          - Через брокера — по инвестиционным счетам и бумагам
          - Через банк — по ипотеке и страхованию
          - Через ФНС — универсально, если данные не переданы автоматически
          - Проверить, не использован ли вычет ранее по тому же основанию
      - title: Практика инвестора
        points:
          - Учитывать вычеты при оценке доходности стратегии после налогов
          - Не покупать продукт только ради вычета: экономия меньше убытка
          - Срок владения важнее: льгота за долгое владение может быть выгоднее
          - Проверять лимиты года, они меняются
    pitfalls:
      - Считать, что вернуть можно всю сумму расходов
      - Оформлять вычет повторно по тому же основанию
      - Путать вычет с освобождением от налога
      - Покупать инструмент ради вычета при плохой доходности
    sections: [verdict, macro]
    sectors: []
    keywords: [налоги, ндфл, вычет, иис, имущественный, социальный, инвестиционный, прогрессивная шкала, возврат]
