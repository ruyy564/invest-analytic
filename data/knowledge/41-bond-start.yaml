# Тема: с чего начать в облигациях и зачем они в портфеле (Академия Т-Инвестиций).
version: 1
topics:
  - id: bond-start
    title: С чего начать в облигациях
    summary: Облигации решают три задачи — доход, снижение риска и резерв для будущих вложений; новичку проще начать с фонда или коротких выпусков надёжных эмитентов.
    points:
      - Облигации дают три вещи: текущий доход, снижение волатильности портфеля и резерв для будущих покупок
      - Следить за долговым рынком полезно даже тем, у кого в портфеле только акции: он сигналит раньше
      - В кризис облигации помогают пережить просадку, если это короткие и качественные выпуски
      - Агрессивному инвестору облигации тоже нужны — как буфер и источник средств на докупку
      - Новичку проще начать с облигационного фонда: сразу диверсификация и управление дюрацией
      - Отдельные выпуски дают контроль, но требуют проверки кредитного риска и оферт
      - Перед покупкой смотреть доходность к погашению, а не купон, и срок под свой горизонт
      - Не покупать длинные выпуски, если деньги могут понадобиться раньше погашения
    details:
      - title: Три задачи облигаций
        points:
          - Доход: купоны и разница цены, предсказуемее акций
          - Защита: меньше просадка, особенно у коротких бумаг
          - Резерв: деньги под будущие идеи, которые не простаивают
      - title: Фонд или отдельные выпуски
        points:
          - Фонд: диверсификация, управление дюрацией, проще для новичка
          - Отдельные выпуски: контроль состава и сроков, но нужен анализ
          - Комиссии фонда против комиссии за сделки
          - Сравнивать фонд по составу, а не только по доходности
      - title: Что смотреть перед покупкой
        points:
          - Доходность к погашению и к оферте
          - Кредитные метрики эмитента и рейтинг
          - Дюрация и срок под горизонт
          - Ликвидность и объём выпуска
          - Налоги и комиссии
      - title: Сигналы долгового рынка
        points:
          - Рост доходностей ОФЗ — давление на все оценки
          - Расширение спреда корпоратов к ОФЗ — рост кредитного риска
          - Инверсия кривой — ожидание замедления
          - Аукционы Минфина: спрос показывает аппетит к риску
    pitfalls:
      - Начинать с самого доходного и рискованного выпуска
      - Держать длинные облигации на короткие деньги
      - Смотреть только на купон
      - Игнорировать сигналы долгового рынка при выборе акций
    sections: [verdict, macro]
    sectors: [финансы]
    keywords: [облигации, начать, фонд, выпуск, дюрация, доходность, кредитный риск, офз, сигналы, резерв]
    sources:
      - Т-Инвестиции, «Как начать инвестировать в облигации»
