# Тема: от чего зависит курс рубля (по материалам Т-Инвестиций).
version: 1
topics:
  - id: ruble-rate
    title: Курс рубля
    summary: Курс рубля — это баланс валюты в стране: сколько её приносят экспортёры и сколько тратят импортёры, с поправкой на ставку, бюджетное правило и регулирование.
    points:
      - Курс двигают потоки, а не «справедливая стоимость»: валютная выручка экспортёров против спроса импортёров
      - Меньше валютной выручки (низкие цены и премии за сырьё, слабая логистика экспорта) — рубль слабеет
      - Больше импорта — больше спроса на валюту — рубль слабеет
      - Резкий рост ставки делает рублёвые инструменты доходнее, и часть денег перетекает из валюты в рубли — рубль крепнет
      - Бюджетное правило и ФНБ: траты из фонда означают продажу валюты ЦБ и поддержку рубля; изменения правила могут резко двинуть курс
      - Доллар и евро после санкций против инфраструктуры торгуются вне биржи, поэтому их курс — расчётный, а ориентир по ликвидности — юань
      - Слабый рубль разгоняет инфляцию через импортные цены, а инфляция удерживает ставку высокой — обратная связь
      - Для экспортёров слабый рубль плюс, но пошлины и налоги срезают эффект; импортёрам и ритейлу он бьёт по марже
    details:
      - title: Что следить по курсу
        points:
          - Динамика нефти и дисконт к Brent: премия за российскую нефть определяет приток валюты
          - Объёмы экспорта физически: зерно, нефтепродукты, металлы — логистика важнее цен
          - Импорт и потребительский спрос: восстановление импорта ослабляет рубль
          - Ставки по юаневой ликвидности: дорогие юани означают повышенный спрос на валюту
          - Операции ЦБ по бюджетному правилу и зеркалированию расходов
      - title: Как курс доходит до бумаг
        points:
          - Экспортёры: выручка в валюте, издержки в рублях — слабый рубль увеличивает рублёвую выручку
          - Импортёры и ритейл: закупка дорожает, цены поднимают с задержкой, маржа сжимается первой
          - Компании с валютным долгом: слабый рубль увеличивает долг в рублях и процентные расходы
          - Внутренний спрос: инфляция от курса снижает реальные доходы и спрос
      - title: Инфляция и ставка
        points:
          - Перенос курса в цены занимает недели и месяцы, эффект виден в инфляции позже
          - ЦБ реагирует на инфляционные ожидания, а не только на текущий курс
          - Высокая ставка сдерживает отток в валюту, но давит на кредит и спрос
          - Резкие движения курса повышают волатильность и премию за риск в акциях и облигациях
      - title: Что делать инвестору
        points:
          - Не строить прогноз на одной точке курса: важнее тренд и причины
          - Смотреть на валютную структуру портфеля: рублёвые активы при слабом рубле теряют в валюте
          - Учитывать, что экспортёр и импортёр по-разному реагируют на одно и то же движение
          - Проверять хеджирование и валютный долг в отчётности компании
    pitfalls:
      - Объяснять курс только ставкой или только нефтью
      - Покупать экспортёра «под слабый рубль», не глядя на пошлины и налоги
      - Игнорировать валютный долг компании
      - Ждать мгновенного переноса курса в инфляцию
    sections: [macro, verdict]
    sectors: []
    keywords: [рубль, курс, доллар, юань, евро, экспорт, импорт, ставка, фнб, бюджетное правило, девальвация]
    sources:
      - Т-Инвестиции, «Рубль наконец начал слабеть: в чём причина и как долго это продлится»
