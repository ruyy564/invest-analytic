# Тема: металлы и эмитенты.
version: 1
topics:
  - id: commodities
    title: Металлы и эмитенты
    summary: Цены на металлы транслируются в выручку экспортёров, издержки переработчиков и курс валюты; один и тот же рост цены металла выгоден одним эмитентам и вреден другим.
    points:
      - Рост цен на медь, никель и палладий поддерживает выручку добывающих компаний
      - Тот же рост давит на машиностроение и электронику как на потребителей сырья
      - Сталь и железная руда влияют на металлургов с полным циклом и на строительный сектор через стоимость материалов
      - Золото воспринимается как защитный актив и реагирует на реальную ставку и спрос на защиту
      - Алюминий чувствителен к стоимости электроэнергии — цены на энергию меняют маржу производителей
      - Удобрения зависят от цен на газ, и рост газа переносится в себестоимость
      - Для экспортёров важен не только уровень цены, но и курс — ослабление валюты частично компенсирует падение цен
      - Разовые факторы (пошлины, логистика, ограничения) меняют картину сильнее мирового цикла
      - Металлы цикличны — высокая цена привлекает предложение и давит на неё через один-два года
    details:
      - title: Металлы и кто от них зависит
        points:
          - Медь — индикатор промышленного спроса: влияет на добычу, кабели, электротехнику
          - Никель и палладий — металлургия, аккумуляторы и катализаторы
          - Алюминий — энергоёмкое производство, зависит от стоимости электроэнергии
          - Золото — защитный актив, зависит от реальной ставки и спроса на защиту
          - Серебро — часть промышленного и защитного спроса одновременно
          - Железная руда и сталь — строительство, машиностроение, инфраструктура
          - Удобрения — газ как сырьё и сельхозцикл как спрос
      - title: Как цены металлов доходят до акций
        points:
          - Выручка экспортёра зависит от мировой цены и курса валюты
          - Себестоимость добычи и переработки зависит от энергии, логистики и труда
          - Пошлины и налоговые режимы меняют прибыль сильнее, чем небольшие движения цены
          - Переработчики выигрывают от падения цен на сырьё при стабильных ценах на конечную продукцию
      - title: Курс, ставка и цикл
        points:
          - Ослабление валюты поддерживает экспортёров и давит на импортёров сырья
          - Высокая ставка удорожает проекты расширения добычи
          - На пике цен компании показывают рекордную прибыль, но именно тогда риск разворота выше
          - Низкая цена закрывает нерентабельные производства — предложение сокращается через время
      - title: Что проверять в идее
        points:
          - Полный цикл: есть ли у компании добыча и переработка, как это влияет на маржу
          - Долговая нагрузка: переживёт ли компания падение цен на треть
          - Дивидендная политика: платят ли из свободного потока или из долга
          - Зависимость от одного рынка сбыта и одного покупателя
    pitfalls:
      - Покупать металлурга на пике цен, считая P/E низким
      - Игнорировать курс при оценке экспортёра
      - Считать любую добывающую компанию одинаково чувствительной к цене металла
      - Забывать про пошлины и логистику при прогнозе маржи
    sections: [opinions, verdict]
    sectors: [материалы, энергетика, промышленность]
    keywords: [металл, металлы, медь, никель, алюминий, золото, серебро, палладий, сталь, руда, сырьё, удобрения, добыча]
    sources:
