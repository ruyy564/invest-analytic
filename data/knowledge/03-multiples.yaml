# Тема: мультипликаторы и оценка.
version: 1
topics:
  - id: multiples
    title: Мультипликаторы
    summary: Мультипликатор — это цена, делённая на измеритель бизнеса; сам по себе он ничего не значит, важен контекст отрасли, долга, цикла и качества прибыли.
    points:
      - P/E показывает, сколько рынок платит за рубль прибыли; сравнивать его можно только внутри отрасли и фазы цикла
      - P/B полезен для банков и компаний с материальными активами, но бесполезен там, где активы — люди и бренды
      - EV/EBITDA учитывает долг, поэтому честнее сравнивает компании с разной нагрузкой
      - Дивидендная доходность без учёта устойчивости выплат превращается в ловушку высокой доходности
      - ROE и ROCE показывают отдачу на капитал, но высокий ROE при большом долге — это риск, а не качество
      - Долг/EBITDA выше трёх обычно означает чувствительность к ставке и слабую устойчивость в кризис
      - Бумага с низким P/E может быть дешёвой из-за падения прибыли — сначала проверяют, разовый ли эффект
      - Мультипликаторы не работают для убыточных компаний и для цикличных на пике прибыли
    details:
      - title: Ценовые мультипликаторы
        points:
          - P/E — цена к прибыли за год; для циклических компаний прибыль нормализуют по циклу
          - P/S — цена к выручке; полезен, когда прибыль временно подавлена, но требует контроля маржи
          - P/B — цена к капиталу; основной для банков, страховых и компаний с материальными активами
          - EV/EBITDA — стоимость бизнеса к операционной прибыли; нивелирует разницу в долге и налогах
      - title: Доходность и качество
        points:
          - Дивидендная доходность — выплата к цене; проверяют покрытие выплат свободным денежным потоком
          - ROE — прибыль к собственному капиталу; растёт от плеча, поэтому смотрят на долг
          - ROCE — прибыль к вложенному капиталу; показывает эффективность бизнеса без эффекта долга
          - Рентабельность по EBITDA и чистая маржа показывают устойчивость бизнес-модели
      - title: Долг и ликвидность
        points:
          - Чистый долг к EBITDA показывает, сколько лет бизнесу нужно, чтобы расплатиться
          - Покрытие процентов прибылью — способность обслуживать долг при падении выручки
          - Короткий долг против длинного: риск рефинансирования выше там, где долг нужно перекредитовать в неудачный момент
          - Ликвидность акции влияет на цену выхода не меньше, чем оценка
      - title: Когда мультипликаторы не работают
        points:
          - Убыточные и быстрорастущие компании оценивают по выручке, юнит-экономике и денежному потоку
          - У циклических на пике прибыли P/E выглядит низким, хотя риск уже высок
          - У банков P/E искажён резервами, а P/B зависит от качества капитала
          - Разовые эффекты в прибыли (продажа актива, переоценка) ломают сравнение год к году
    pitfalls:
      - Сравнивать P/E компаний из разных отраслей
      - Покупать только по низкому P/E без проверки прибыли
      - Игнорировать долг при сравнении по P/E
      - Считать высокий ROE признаком качества без учёта плеча
    sections: [opinions, verdict]
    sectors: []
    keywords: [мультипликатор, мультипликаторы, p/e, p/b, p/s, ev/ebitda, dy, roe, roce, долг, оценка, дорого, дёшево]
    sources:
      - Асват Дамодаран, «Инвестиционная оценка»
      - Бенджамин Грэм, «Разумный инвестор»
