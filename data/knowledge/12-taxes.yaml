# Тема: налоги и комиссии инвестора.
# Ставки и лимиты меняются — тезисы описывают механику, актуальные нормы проверяют в НК РФ.
version: 1
topics:
  - id: taxes
    title: Налоги и комиссии инвестора
    summary: Брокер считает налог с реализации и купонов, но льготы и сальдирование убытков не применяются автоматически — их нужно подтверждать; доходность считается после налогов и комиссий, а не до них.
    points:
      - Налог на доходы физических лиц платится с прибыли от продажи бумаг, с купонов и с дивидендов
      - Прибыль считается по методу FIFO — проданные бумаги сопоставляются с самыми ранними покупками
      - Убыток по одним бумагам уменьшает налоговую базу по другим в рамках одного года, если брокер сальдирует
      - Льгота долгосрочного владения освобождает от налога прибыль по бумагам, которыми владели больше трёх лет
      - Индивидуальный инвестиционный счёт даёт вычет, но имеет ограничения по сроку и типу дохода
      - Дивиденды облагаются налогом у источника выплаты — на счёт приходит уже уменьшенная сумма
      - Купоны по облигациям облагаются налогом, за исключением отдельных льготных выпусков
      - Налог удерживается при выводе денег или в конце года; реинвестирование не отменяет обязанность
      - Иностранные бумаги и валютная переоценка добавляют сложность — проверяют статус бумаги и валюты
      - Комиссия брокера, биржи и депозитария уменьшает результат даже при нулевой прибыли по сделке
    details:
      - title: С каких доходов платится налог
        points:
          - Прибыль от продажи акций, облигаций, фондов и валюты
          - Купонный доход по облигациям и дисконт при погашении
          - Дивиденды по акциям и выплаты по фондам
          - Проценты на остаток денежных средств, если брокер их начисляет
          - Доход от операций с производными инструментами — учитывается отдельно
      - title: Как уменьшить налог законно
        points:
          - Держать бумаги больше трёх лет и применять льготу долгосрочного владения
          - Сальдировать убытки с прибылью в одном году, если брокер это поддерживает
          - Использовать индивидуальный инвестиционный счёт и его вычет
          - Переносить убыток прошлых лет в пределах установленного срока
          - Учитывать налоговый статус выпуска облигаций до покупки
      - title: Льготы и счета
        points:
          - Льгота долгосрочного владения применяется к бумагам, а не к фондам любого типа
          - ИИС первого типа даёт вычет на внесённые средства, второго — освобождение дохода при закрытии
          - Досрочное закрытие счёта лишает льгот — срок нужно планировать заранее
          - Смена брокера с переводом активов сохраняет историю владения, смена с продажей — нет
          - Лимиты вычетов и сроки владения проверяют перед каждой сделкой
      - title: Дивиденды, купоны и валюты
        points:
          - Дивиденды приходят за вычетом налога и отражаются в отчёте брокера
          - Купоны по льготным выпускам сравнивают с обычными — разница видна в документах выпуска
          - Переоценка валюты при покупке и продаже бумаг даёт курсовую разницу, которая влияет на базу
          - Замещающие облигации имеют собственные правила выплат и налогообложения
          - Отчёт брокера и справка для налоговой — основной источник для сверки
      - title: Комиссии и издержки
        points:
          - Комиссия за сделку бывает процентной, с минимальным порогом или тарифом за план
          - Комиссия фонда считается внутри стоимости пая и не видна в выписке сделки
          - Хранение и вывод денег могут тарифицироваться отдельно
          - Частые сделки накапливают издержки, которые быстро превышают разницу в идеях
          - Итоговую доходность считают после комиссий и налогов — иначе сравнение стратегий некорректно
    pitfalls:
      - Считать дивидендную доходность до налога и считать её чистым доходом
      - Планировать закрытие ИИС раньше срока ради новой идеи
      - Забывать про сальдирование убытков и переплачивать налог
      - Сравнивать фонд и отдельные акции без учёта комиссии фонда
      - Торговать часто, не учитывая комиссию и налог с коротких сделок
    sections: [tax, verdict, macro]
    sectors: []
    keywords: [налог, налоги, ндфл, дивиденды, купоны, иис, льгота, сальдирование, комиссия, брокер, нк рф, декларация, вычет]
    sources:
      - Налоговый кодекс РФ, глава 23 — порядок и ставки НДФЛ
      - Разъяснения ФНС по операциям с ценными бумагами
      - Документация брокера по налоговому агенту и отчётам
