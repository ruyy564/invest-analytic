# Тема: стагфляция — спад и инфляция одновременно (по материалам Академии Т-Инвестиций).
version: 1
topics:
  - id: stagflation
    title: Стагфляция
    summary: Стагфляция — одновременный спад экономики и высокая инфляция; она ломает привычные правила, потому что стимулирование разгоняет цены, а жёсткая политика углубляет спад.
    points:
      - Термин появился в Великобритании в 1960-х: «инфляция с одной стороны и застой с другой, а то и другое вместе»
      - Классический пример — США 1970-х: выход из Бреттон-Вудса, эмбарго ОАПЕК, нефть вчетверо дороже, инфляция выше 12 % при падающем ВВП
      - Победить её удалось только жёсткой ставкой: Волкер поднял её до 20 % в 1980-м, инфляция к 1986-му замедлилась до 1,1 %
      - Российский опыт 1990-х называют слампфляцией: ВВП упал на 41 % за шесть лет, цены выросли на 3 812 %, закончилось дефолтом 1998 года
      - Причина — шок предложения: дорожает сырьё или логистика, издержки растут, а спрос при этом слабый
      - Ставка плохо лечит шок предложения: она не создаёт нефть и не чинит логистику, а только сжимает спрос
      - В стагфляции страдают длинные облигации, компании с высоким долгом и истории роста без прибыли
      - Выигрывают компании с ценовой силой, короткие флоатеры, сырьевые производители и реальные активы
    details:
      - title: Как она возникает
        points:
          - Шок предложения: топливо, логистика, импортные комплектующие дорожают быстрее, чем растёт спрос
          - Мягкая политика в момент шока: деньги дешёвые, цены растут, производства не прибавляется
          - Ожидания: люди и компании начинают закладывать инфляцию в зарплаты и цены, и она закрепляется
          - Внешние ограничения: эмбарго, санкции, разрыв цепочек поставок
      - title: Почему регулятору тяжело
        points:
          - Поднять ставку — задушить и без того слабый рост и инвестиции
          - Оставить ставку низкой — закрепить инфляционные ожидания и потерять доверие к деньгам
          - Шоки предложения требуют времени: пока логистика и добыча не восстановятся, цены давят
          - Политика доходов и ценовые ограничения дают временный эффект и дефицит
      - title: Что делать инвестору
        points:
          - Сокращать дюрацию: короткие облигации и флоатеры меньше страдают от инфляции
          - Проверять долг: у компаний с плавающим долгом и высокой нагрузкой риск процентных расходов выше
          - Искать ценовую силу: бизнес, который может повышать цены без потери спроса
          - Сырьё и реальные активы — историческая защита, но волатильность высокая
          - Не держать весь портфель в одной ставке на разворот — сценарий может длиться годами
      - title: Как распознать заранее
        points:
          - Инфляционные ожидания растут быстрее фактической инфляции
          - Цены на сырьё и топливо растут, а промышленное производство стагнирует
          - Ставка повышается, но инфляция не реагирует
          - Рынок труда жёсткий: зарплаты индексируются, безработица низкая при слабом росте
    pitfalls:
      - Считать рост цен временным, пока ожидания уже закрепились
      - Покупать длинные облигации «под снижение ставки» в разгар инфляционного шока
      - Держать компании с большим долгом и слабой маржой
      - Путать стагфляцию с обычной рецессией: реакция активов разная
    sections: [macro, verdict]
    sectors: []
    keywords: [стагфляция, инфляция, спад, ставка, шок предложения, волькер, бреттон-вудс, ожидания, флоатер, дюрация]
    sources:
      - Т-Инвестиции, «Феномен стагфляции: чем она необычна и почему её сложно побороть»
      - История ФРС: политика Пола Волкера 1979–1987
