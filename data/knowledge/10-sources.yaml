# Тема: источники знаний и литература.
version: 1
topics:
  - id: sources
    title: Источники знаний и литературы
    summary: База знаний опирается на классическую литературу по оценке и поведению инвестора, а также на публичную аналитику брокеров; это ориентиры для трактовки, а не источник текущих цен.
    points:
      - Аналитика БКС Экспресс — обзоры рынка, идеи и комментарии к отчётности, попадает в новостную ленту сервиса
      - Аналитика полезна как контекст, но её выводы проверяют по фактам портфеля
      - Книга — это метод, а не сигнал; текущие решения принимаются по данным портфеля и рынка
      - Один источник редко даёт полную картину — сравнивают минимум два независимых
      - Прогнозы аналитиков имеют горизонт и условия, которые нужно читать, а не только целевую цену
      - Литература по поведению объясняет ошибки лучше, чем литература по прогнозам
    details:
      - title: Аналитика брокеров
        points:
          - БКС Экспресс — обзоры рынка, идеи по эмитентам, комментарии к отчётности
          - Полезно: аргументы и факты, на которые ссылается аналитик
          - Осторожно: целевая цена без горизонта и условий почти бесполезна
          - Несколько источников могут повторять один и тот же тезис — это не подтверждение
      - title: Книги по оценке и стратегии
        points:
          - Бенджамин Грэм, «Разумный инвестор» — маржа безопасности и дисциплина оценки
          - Бертон Малкиел, «Случайная прогулка по Уолл-стрит» — индексный подход и диверсификация
          - Питер Линч, «Метод Питера Линча» — понимание бизнеса за цифрами
          - Асват Дамодаран, «Инвестиционная оценка» — ставка дисконтирования и мультипликаторы
          - Говард Маркс, «О самом важном» — циклы, риск и второй уровень мышления
      - title: Книги по поведению и истории
        points:
          - Даниэль Канеман, «Думай медленно, решай быстро» — искажения решений
          - Джейсон Цвейг, «Ваше право быть богатым» — поведенческие ловушки инвестора
          - Чарльз Киндлбергер, «Мировые финансовые кризисы» — механика пузырей и паник
          - Джон Богл, «Общий фондовый индекс» — долгий горизонт и издержки
      - title: Как читать источники
        points:
          - Отделять факт от мнения и оценку от прогноза
          - Проверять дату публикации: совет двухлетней давности может быть вредным
          - Смотреть, на каких данных построен вывод — отчётность, статистика или оценка автора
          - Искать аргумент против своей позиции, а не только подтверждение
          - Записывать, какой источник на что повлиял — так видно ошибки
    pitfalls:
      - Принимать целевую цену за обещание
      - Считать количество источников доказательством
      - Читать только согласные с позицией материалы
      - Смешивать исторические примеры с текущими данными
