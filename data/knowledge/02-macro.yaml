# Тема: макроэкономика и ключевая ставка.
version: 1
topics:
  - id: macro
    title: Макроэкономика и ключевая ставка
    summary: Макро для портфеля сводится к немногим связям — ставка и инфляция задают требуемую доходность, от неё зависят оценки акций, стоимость долга и привлекательность облигаций.
    points:
      - Рост ставки повышает дисконт будущих прибылей, поэтому сильнее страдают длинные истории роста
      - Снижение ставки помогает оценкам, но действует с задержкой и лишь при устойчивом спросе
      - Реальная доходность вклада и облигаций — конкурент акциям, поэтому высокая безрисковая ставка давит на мультипликаторы
      - Инфляция бьёт по компаниям с низкой ценовой силой — ритейл и коммунальные услуги с регулируемыми тарифами
      - Курс валюты влияет на экспортёров и импортёров в противоположные стороны
      - Один макро-показатель не повод менять портфель — важна комбинация ставки, инфляции и ожиданий
      - Ожидания рынка важнее текущего значения: рынок двигает не факт, а отклонение от ожиданий
      - Высокая ставка увеличивает стоимость обслуживания долга, поэтому первыми страдают компании с плавающим долгом
    details:
      - title: Ставка и оценки
        points:
          - Денежный поток через много лет стоит сегодня меньше при высокой ставке — длинные истории чувствительнее
          - Банки выигрывают от умеренно высоких ставок на кредитах, но страдают при резком росте стоимости фондирования
          - Девелоперы и лизинговые компании зависят от стоимости финансирования сильнее остальных
          - Облигации с длинным сроком чувствительнее к изменению ставки, чем короткие
      - title: Инфляция и секторы
        points:
          - Компании с ценовой силой переносят инфляцию в цену, остальные теряют маржу
          - Сырьевые компании выигрывают от роста цен на свою продукцию, но проигрывают от роста издержек на энергию
          - Ритейл с низкой маржой и регулируемые тарифы — самые уязвимые к инфляции издержек
          - Инфляция зарплат давит на трудоёмкие отрасли — услуги, логистику, строительство
      - title: Курс валюты
        points:
          - Ослабление валюты помогает экспортёрам и компаниям с валютной выручкой
          - Укрепление валюты помогает импортёрам и компаниям с валютным долгом без выручки
          - Курс влияет на прибыль отчётного периода и на дивидендную базу
          - Валютная диверсификация портфеля снижает зависимость от одной денежной политики
      - title: Что смотреть инвестору
        points:
          - Ставка и её траектория, инфляция и инфляционные ожидания
          - Кривая доходности и стоимость заимствований для бизнеса
          - Курс и его влияние на отчётность экспортёров
          - Бюджетная и налоговая политика: изменения меняют прибыль целых секторов
    pitfalls:
      - Делать вывод из одной публикации ставки без контекста ожиданий
      - Считать, что снижение ставки немедленно поднимает все акции
      - Игнорировать долг компании при оценке чувствительности к ставке
      - Путать номинальную доходность с реальной — инфляция съедает часть результата
    sections: [macro, opinions, verdict]
    sectors: [финансы, недвижимость]
    keywords: [ставка, инфляция, макро, макроэкономика, курс, валют, цб, дисконт, доходность, вклад, облигаци]
    sources:
      - Асват Дамодаран, «Инвестиционная оценка» — про ставку дисконтирования
      - Аналитика БКС Экспресс — еженедельные обзоры ставки и рынка
