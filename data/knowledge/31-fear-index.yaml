# Тема: индекс страха (VIX/RVI) и оценка настроений (Академия Т-Инвестиций).
version: 1
topics:
  - id: fear-index
    title: Индекс страха
    summary: Индекс волатильности показывает, какую волатильность рынок ожидает в ближайший месяц, то есть заложенную премию за риск, а не предсказывает направление.
    points:
      - Индекс страха оценивает ожидания, а не факты: он говорит о заложенной премии за риск
      - VIX считается по ценам опционов на S&P 500; чем дороже становятся опционы, тем выше индекс
      - Пут-опцион — страховка от падения: когда инвесторы боятся, она дорожает, и индекс растёт
      - Обычно VIX держится в диапазоне 15–40 пунктов; пик 89,53 был в октябре 2008 года, минимум 8,56 — в ноябре 2017-го
      - Российский аналог — RVI Мосбиржи с 2013 года, считается по опционам на фьючерс индекса РТС
      - Индекс страха и жадности CNN (Fear & Greed) складывается из семи параметров и оценивает настроения
      - Высокий индекс страха означает не «покупай», а «риск дорогой»: реакция зависит от причины страха
      - Низкий индекс страха — спокойные ожидания и одновременно низкая премия за риск
    details:
      - title: Как читать значение
        points:
          - Умеренный рост индекса при спокойном рынке — хеджирование, а не паника
          - Резкий скачок почти всегда связан с конкретным событием: проверьте, каким
          - Долгий повышенный уровень означает, что рынок живёт в режиме неопределённости
          - Снижение индекса с высоких значений — сигнал нормализации ожиданий
      - title: Ограничения
        points:
          - Индикатор не предсказывает направление — только ожидаемую амплитуду
          - Опционный рынок может быть тонким: значения искажаются
          - Расчёт по разным базовым активам (S&P 500 и РТС) несопоставим напрямую
          - Настроения меняются быстрее, чем фундаментальные показатели
      - title: Как использовать в решениях
        points:
          - Как фон: дорогой риск требует большего запаса в цене входа
          - Как проверку гипотезы: скачок волатильности без новости — повод искать причину
          - Как напоминание о дисциплине: паника — плохой момент для изменения стратегии
          - В отчёте указать, что это ожидания рынка, а не оценка бумаги
      - title: Смежные индикаторы настроений
        points:
          - Индекс страха и жадности CNN — агрегат из семи параметров
          - Широта рынка: сколько бумаг растёт вместе с индексом
          - Потоки в фонды: притоки и оттоки денег
          - Объёмы торгов: подтверждение движения
    pitfalls:
      - Воспринимать высокий индекс страха как сигнал к покупке
      - Сравнивать значения VIX и RVI напрямую
      - Игнорировать причину роста волатильности
      - Строить стратегию на одном индикаторе настроений
    sections: [macro, opinions]
    sectors: []
    keywords: [волатильность, vix, rvi, индекс страха, опционы, премия за риск, настроения, fear greed]
