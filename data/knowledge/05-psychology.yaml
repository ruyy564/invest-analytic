# Тема: психология принятия решений.
version: 1
topics:
  - id: psychology
    title: Психология принятия решений
    summary: Большая часть потерь частного инвестора — не от плохих бумаг, а от решений под эмоциями; знание своих искажений дешевле, чем любая аналитика.
    points:
      - Неприятие потерь заставляет держать убыточные позиции и продавать прибыльные — эффект диспозиции
      - FOMO и стадное поведение приводят к покупке на пике, когда о бумаге говорят все
      - Якорение на цене покупки мешает оценивать бумагу по текущим перспективам
      - Эффект недавности переоценивает последние месяцы и распространяет их на будущее
      - Подтверждение своей правоты заставляет читать только согласные с позицией источники
      - Излишняя уверенность в собственном прогнозе ведёт к чрезмерной концентрации и плечу
      - Дисциплина держится на правилах заранее, а не на настроении в моменте
      - Дневник решений с причиной входа помогает отделить ошибку анализа от ошибки поведения
    details:
      - title: Основные искажения
        points:
          - Неприятие потерь — боль от убытка сильнее радости от равной прибыли
          - Эффект диспозиции — продаём победителей, держим проигравших
          - Якорение — цепляемся за цену покупки или за прошлый максимум
          - Эффект недавности — последние месяцы кажутся главным трендом
          - Подтверждение — ищем факты в пользу своей позиции
          - Стадность — покупаем потому, что покупают другие
          - Излишняя уверенность — сужаем диапазон возможных исходов
      - title: Эмоциональный цикл инвестора
        points:
          - Эйфория на пике совпадает с максимальным числом позитивных новостей
          - Отрицание и страх приходят после падения, когда оценки уже ниже
          - Капитуляция часто случается вблизи минимума — её признак массовые продажи
          - Скука и безразличие в боковике ломают дисциплину не хуже паники
      - title: Правила дисциплины
        points:
          - Лимит доли на бумагу и на сектор — заранее, до покупки
          - Условие пересмотра: цена, событие или дата, а не настроение
          - Записанная причина входа — критерий, по которому потом проверяют решение
          - Пауза перед сделкой: решение, принятое за минуту, редко бывает продуманным
          - Отказ от плеча и сложных продуктов, которые не объяснить в двух предложениях
          - Регулярный обзор решений раз в квартал вместо ежедневного просмотра цен
      - title: Как это выглядит в портфеле
        points:
          - Держать убыточную бумагу «до возврата к своей цене» — типичная ошибка поведения
          - Продавать всё при первой просадке — вторая сторона той же ошибки
          - Покупать на новостях, когда цена уже отразила событие
          - Изменять стратегию после каждого убыточного месяца
    pitfalls:
      - Оценивать решение по результату, а не по процессу
      - Считать, что прошлая доходность гарантирует будущую
      - Принимать решения на эмоциях и объяснять их «интуицией»
      - Проверять портфель по несколько раз в день
    sections: [verdict, opinions]
    sectors: []
    keywords: [психология, поведение, эмоции, fomo, искажение, дисциплина, якорь, паника, жадность, страх]
    sources:
      - Даниэль Канеман, «Думай медленно, решай быстро»
      - Джейсон Цвейг, «Ваше право быть богатым» — про поведенческие ловушки
