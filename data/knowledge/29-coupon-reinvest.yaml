# Тема: реинвестирование купонов и эффект сложного процента (исследование Т-Инвестиций).
version: 1
topics:
  - id: coupon-reinvest
    title: Реинвестирование купонов
    summary: Купон — это не финал, а топливо: если возвращать выплаты на рынок, работает сложный процент, и итоговая доходность заметно выше.
    points:
      - Исследование почти 300 тыс. счетов Т-Инвестиций: счета с реинвестированием дали медианную доходность на 5,5 % годовых выше
      - Чем выше доля реинвестированных купонов, тем выше доходность портфеля в выборке
      - Активным реинвестированием считалось направление не менее половины купонов на новые облигации или денежный рынок в течение 14 дней
      - Счета без реинвестирования чаще фиксировали значительные убытки и показывали меньшую доходность
      - Закономерность сохранялась на разных горизонтах — это устойчивый эффект, а не случайность
      - Реинвестировать чаще склонны состоятельные клиенты со средним портфелем выше 10 млн рублей
      - Реинвестирование не отменяет риск: оно усиливает и результат, и ошибку в выборе бумаг
      - Купоны можно направлять в короткие бумаги денежного рынка, если нет подходящего выпуска на длинный срок
    details:
      - title: Почему это работает
        points:
          - Сложный процент: купон сам начинает приносить доход
          - Постоянное присутствие капитала на рынке вместо простоя на счёте
          - Регулярные покупки сглаживают точку входа
          - Дисциплина: решение принимается по правилу, а не по настроению
      - title: Как делать правильно
        points:
          - Заранее определить правило: куда и в какой срок направляются купоны
          - Не откладывать на «подожду удобный момент» — это и есть главный тормоз доходности
          - Следить за ликвидностью и сроком новых выпусков, чтобы не нарушать горизонт
          - Учитывать налоги и комиссии при реинвестировании
          - Не реинвестировать в бумаги с рискованным кредитным профилем ради доходности
      - title: Когда реинвестировать не стоит
        points:
          - Если деньги нужны на расходы по плану — купон и есть цель выплат
          - Если нет подходящего выпуска с приемлемым риском
          - Если портфель перегрет долгом одного эмитента — лучше диверсифицировать
          - Если горизонт короткий и цена входа важна
      - title: Как измерить эффект
        points:
          - Сравнивать доходность счёта с реинвестированием и без на одном горизонте
          - Смотреть медианную доходность, а не единичные примеры
          - Учитывать, что результат зависит от ставок в период реинвестирования
          - Проверять, не съедают ли эффект комиссии и налоги
    pitfalls:
      - Держать купоны на счёте «до лучших времён»
      - Реинвестировать в первую попавшуюся бумагу с высокой доходностью
      - Путать эффект реинвестирования с гарантией доходности
      - Игнорировать диверсификацию ради регулярности покупок
    sections: [verdict, macro]
    sectors: [финансы]
    keywords: [реинвестирование, купон, сложный процент, доходность, денежный рынок, дисциплина, лавина купонов]
    sources:
      - Т-Инвестиции, «Как правильно реинвестировать купоны облигаций» (исследование 300 тыс. счетов)
