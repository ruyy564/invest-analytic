# Тема: что двигает цены облигаций и как считать доходность (Академия Т-Инвестиций).
version: 1
topics:
  - id: bond-prices
    title: Цена облигации и доходность
    summary: Цена облигации — это ожидания по ставке и оценка риска эмитента; поэтому купонная ставка сама по себе не говорит, выгодна ли покупка.
    points:
      - При росте ставки старые облигации дешевеют: их купон ниже рыночного, цену приходится снижать
      - При снижении ставки облигации дорожают — доход инвестора складывается из купонов и изменения цены
      - Длинные выпуски чувствительнее к ставке: чем больше дюрация, тем сильнее движение цены
      - Ухудшение финансов эмитента снижает цену его долга раньше, чем меняется рейтинг
      - Риск ликвидности: бумагу не всегда удаётся продать по рыночной цене, особенно у мелких выпусков
      - Купонная ставка, текущая доходность и доходность к погашению — разные вещи, смотреть нужно на доходность к погашению
      - Высокая купонная ставка при цене выше номинала может дать доходность ниже рыночной
      - Накопленный купонный доход не теряется при продаже: покупатель компенсирует продавцу уже заработанный купон
    details:
      - title: Три вида доходности
        points:
          - Купонная доходность считается от номинала и не учитывает цену покупки
          - Текущая доходность — годовой купон к текущей цене, без учёта погашения
          - Доходность к погашению (YTM) учитывает цену, купоны и возврат номинала — главный ориентир сравнения
          - Если облигация куплена с дисконтом, часть дохода придёт при погашении
      - title: От чего зависит цена
        points:
          - Ожидания по ключевой ставке: рынок двигает цены до решения регулятора
          - Кредитная премия: спред к ОФЗ растёт вместе с риском эмитента
          - Дюрация и срок: длинные бумаги реагируют на ставку сильнее
          - Ликвидность: чем меньше сделок, тем шире спред покупки-продажи
          - Оферты и амортизация: график выплат меняет ожидаемый денежный поток
      - title: Как заработать не только на купонах
        points:
          - Купить длинную бумагу при ожидании снижения ставки — заработать на росте цены
          - Держать до погашения — получить номинал и купоны, не завися от рыночной цены
          - Продать до погашения — цена зависит от текущей ставки и настроения рынка
          - Комбинировать короткие и длинные выпуски под свой горизонт и взгляд на ставку
      - title: Частые ошибки при выборе
        points:
          - Смотреть только на купон, не считая доходность к погашению
          - Сравнивать облигации с разным сроком и рейтингом «по цифре доходности»
          - Не проверять цену: покупка выше номинала меняет итоговую доходность
          - Забывать про налоги и комиссии — доходность после них ниже
    pitfalls:
      - Покупать длинную бумагу под снижение ставки без запаса по риску
      - Игнорировать ликвидность выпуска
      - Путать купонную и полную доходность
      - Считать, что высокая доходность всегда лучше: она отражает риск
