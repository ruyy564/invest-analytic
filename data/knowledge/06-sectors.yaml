# Тема: зависимости секторов.
version: 1
topics:
  - id: sector-dependencies
    title: Зависимости секторов
    summary: Каждый сектор зависит от своего набора факторов; понимание этой связки важнее общей оценки рынка, потому что портфель состоит из конкретных секторов.
    points:
      - Финансы зависят от ставки, стоимости фондирования, качества кредитного портфеля и достаточности капитала
      - Энергетика зависит от цен на нефть и газ, налогового режима, курса и объёмов добычи
      - Материалы зависят от мировых цен на сырьё, тарифов, экспортных пошлин и курса
      - Промышленность зависит от инвестиционного спроса, госзаказа, логистики и стоимости кредита
      - Потребительские товары и ритейл зависят от доходов населения, инфляции издержек и покупательной способности
      - Недвижимость и девелопмент зависят от ипотечной ставки, льготных программ и стоимости финансирования
      - Телеком и коммунальные услуги зависят от тарифного регулирования и инфляции издержек
      - Информационные технологии зависят от курса, господдержки, экспорта и доступности оборудования
      - Транспорт зависит от объёмов грузооборота, тарифов и стоимости топлива
      - Здравоохранение зависит от госзакупок, регулирования цен на препараты и импорта оборудования
      - Если непонятен драйвер сектора, непонятна и устойчивость идеи
    details:
      - title: Финансы и недвижимость
        points:
          - Банки зарабатывают на разнице между ставками по кредитам и фондированию
          - Резкое повышение ставки сначала увеличивает процентный доход, потом ухудшает качество портфеля
          - Девелоперы зависят от ипотечной ставки и льготных программ; рост ставки сжимает спрос
          - Страховые компании чувствительны к инвестиционному результату резервов
      - title: Сырьё и промышленность
        points:
          - Нефтегаз зависит от цен на нефть и газ, налогового режима и курса
          - Металлурги зависят от мировых цен, внутренних тарифов, пошлин и спроса Китая
          - Удобрения зависят от цен на газ — он основной компонент себестоимости
          - Промышленность зависит от инвестиционного спроса, госзаказа и стоимости кредита
      - title: Потребительский сектор
        points:
          - Ритейл зависит от реальных доходов, трафика и покупательной способности
          - Низкая маржа делает ритейл уязвимым к инфляции издержек и логистики
          - Потребительские услуги чувствительны к занятости и уверенности потребителя
          - Производители товаров зависят от цен на сырьё и упаковку
      - title: Тарифные и инфраструктурные отрасли
        points:
          - Телеком зависит от тарифов и капитальных затрат на инфраструктуру
          - Энергетика (генерация и сети) зависит от тарифов и цен на топливо
          - Коммунальные услуги — регулируемая маржа: рост издержек не всегда переносится в тариф
          - Транспорт зависит от грузооборота, тарифов и стоимости топлива
      - title: Технологии и здравоохранение
        points:
          - Технологии зависят от курса, доступности оборудования и экспортных возможностей
          - Высокая ставка сильнее бьёт по оценкам компаний роста
          - Здравоохранение зависит от госзакупок и регулирования цен
          - Импорт оборудования и субстанций зависит от курса и логистики
    pitfalls:
      - Судить о секторе по одной бумаге
      - Считать, что диверсификация по эмитентам внутри сектора снижает отраслевой риск
      - Игнорировать регулирование в тарифных отраслях
      - Переносить зависимость одного сектора на весь портфель
    sections: [macro, opinions, verdict]
    sectors: [финансы, энергетика, материалы, промышленность, потребительские товары, потребительские услуги, недвижимость, телеком, коммунальные услуги, информационные технологии, транспорт, здравоохранение]
    keywords: [сектор, секторы, банк, нефтегаз, металлург, ритейл, девелопер, телеком, тариф, отрасл, генерац]
