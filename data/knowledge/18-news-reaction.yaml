# Тема: как рынок реагирует на новости и как читать эту реакцию.
version: 1
topics:
  - id: news-reaction
    title: Реакция на новости
    summary: Цена реагирует не на саму новость, а на отклонение факта от ожиданий и на то, как новость меняет будущие деньги компании — выручку, маржу, долг и риск.
    points:
      - Новость двигает бумагу, когда меняет ожидания по прибыли, долгу или риску; «плохая» новость без влияния на деньги остаётся шумом
      - Сила реакции зависит от неожиданности — ожидаемое событие часто уже в цене, и на факте возможен откат
      - Реакция сильнее у малоликвидных бумаг и в тонком рынке, где мало встречных заявок
      - Оценивать движение нужно относительно сектора и рынка, а не в абсолюте: минус 3 процента при рынке минус 5 — это сила, а не слабость
      - Новость о долге и рефинансировании влияет на оценку через риск, а не через прибыль текущего года
      - Дивидендная новость двигает цену на размер дивиденда и на устойчивость будущих выплат, а не только на дату отсечки
      - Регуляторные решения и тарифы меняют денежные потоки на годы вперёд — реакция бывает отложенной
      - Однодневная реакция часто корректируется: смотреть на объём и удержание цены через несколько сессий
    details:
      - title: Виды новостей и механизм влияния
        points:
          - Отчётность — через прибыль и маржу; важнее динамика выручки, маржи и долга, чем сам факт «прибыль выросла»
          - Дивиденды — через доходность и устойчивость выплат; отсечка важна, но политика важнее
          - Сделки и реструктуризация — через стоимость активов, долг и риск; рынок оценивает, кто платит и чем
          - Регуляторика и тарифы — через будущую выручку и издержки; эффект долгий, а не однодневный
          - Санкции и ограничения — через доступ к рынкам, логистику и издержки; важна доля затронутой выручки
          - Менеджмент и акционеры — через доверие к стратегии и распределению капитала
          - Операционные данные — через объёмы, трафик, продажи; ранний сигнал к отчётности
      - title: Как проверять реакцию
        points:
          - Сравните движение бумаги с сектором и индексом за тот же день и неделю
          - Посмотрите объём: рост на низком объёме менее значим, чем падение на высоком
          - Отделите причину от совпадения: была ли новость именно про эту компанию и её драйверы
          - Проверьте, не отыграла ли бумага новость заранее: ожидание в цене — частая ловушка
      - title: Сила и длительность реакции
        points:
          - Быстрая реакция в первые часы — это переоценка ожиданий, а не новый взгляд на бизнес
          - Устойчивое движение требует подтверждения: следующий отчёт, объёмы, слова менеджмента
          - Если новость меняет не прибыль, а риск — реакция может быть короткой, но волатильной
          - Событие, о котором предупреждали заранее, часто даёт обратный ход на факте
      - title: Как формулировать вывод в отчёте
        points:
          - Сначала факт с датой и источником, затем механизм, затем следствие и оценка
          - Не связывайте новость с ценой, если совпадение только по времени
          - Указывайте, что уже в цене, а что ещё нет — так вывод не устаревает через день
          - Отделяйте влияние на компанию от влияния на настроение рынка
    pitfalls:
      - Считать любую новость причиной движения, если она совпала по времени
      - Читать заголовок без аннотации: в тексте часто обратный смысл
      - Делать вывод по одному дню, не глядя на откат и объём
      - Путать рост на плохом рынке с ростом на хорошем
    sections: [opinions, verdict, macro]
    sectors: []
    keywords: [новость, реакция, событие, отчётность, дивиденды, санкции, тарифы, ожидания, откат, объём]
    sources:
      - Говард Маркс, «О самом важном» — про ожидания и цикл
      - Практика обзоров БКС, Т-Инвестиций, СберИнвестиций: событие, механизм, следствие
