# Тема: история бумаг, кризисы и восстановление.
version: 1
topics:
  - id: history
    title: История бумаг, кризисы и восстановление
    summary: История рынка показывает повторяющиеся сценарии — пузырь, обвал, восстановление; сроки восстановления разные, поэтому выживание портфеля важнее точного входа.
    points:
      - Восстановление редко бывает одномоментным — исторически это годы, а не месяцы
      - Не у всех бумаг восстановление происходит: часть компаний так и не возвращается к прежним уровням
      - Компании с долгом и слабым денежным потоком в кризис теряют больше и восстанавливаются дольше
      - Плечо в кризис превращает просадку в потерю капитала
      - Уроки повторяются — концентрация и вера в «на этот раз иначе» стоят дороже неверной оценки
      - Диверсификация и запас ликвидности дают возможность действовать, когда рынок падает
      - Исторические примеры нужны для понимания механики, а не как обещание доходности
      - После кризиса меняется структура рынка: лидеры прошлого цикла не всегда лидеры следующего
    details:
      - title: Кризис 1998 года
        points:
          - Дефолт по внутреннему долгу, девальвация и обвал банковской системы
          - Восстановление заняло годы, банки и промышленность прошли через реструктуризацию
          - Урок: валютный и долговой риск реализуются одновременно
      - title: Кризис 2008 года
        points:
          - Начался с ипотечных бумаг и перешёл в глобальную рецессию
          - Сильнее всего пострадали банки, девелоперы и экспортёры сырья
          - Урок: кредитное плечо в финансовой системе усиливает падение
      - title: 2014 год
        points:
          - Санкции, ослабление рубля и резкий рост ставки
          - Сильнее просели банки и потребительский сектор
          - Урок: внешние ограничения меняют доступ к капиталу и оборудованию
      - title: Обвал 2020 года
        points:
          - Самое быстрое падение в истории рынка и самое короткое восстановление
          - Технологические компании восстановились первыми, цикличные — позже
          - Урок: скорость реакции политики определяет скорость восстановления
      - title: 2022 год
        points:
          - Закрытие части внешних рынков и перестройка структуры владения
          - Восстановление отдельных бумаг шло неравномерно
          - Урок: страновой и инфраструктурный риск нельзя диверсифицировать внутри одного рынка
      - title: Известные истории компаний
        points:
          - Пузырь доткомов: компании без прибыли и выручки стоили дороже бизнесов с выручкой
          - Компании, пережившие пузырь, восстанавливались годами, часть исчезла
          - Истории зрелых компаний показывают, что рост прибыли и денежный поток важнее хайпа
          - Развороты происходят у компаний, у которых меняется бизнес-модель, а не только настроение рынка
    pitfalls:
      - Ждать восстановления «до своей цены» у слабого бизнеса
      - Считать, что кризис всегда короткий, потому что прошлый был коротким
      - Усреднять убыточную позицию без проверки бизнеса
      - Держать плечо, рассчитывая пересидеть просадку
    sections: [macro, verdict]
    sectors: []
    keywords: [кризис, кризисы, история, обвал, восстановление, дефолт, пузырь, просадка, рецессия]
    sources:
      - Чарльз Киндлбергер, «Мировые финансовые кризисы»
      - Джон Богл, «Общий фондовый индекс» — о долгом горизонте
      - Говард Маркс, «О самом важном» — про циклы и риск
