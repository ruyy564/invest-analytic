# Тема: инструменты рынка и как ими пользоваться.
# Теория и механика: что даёт инструмент, чем платится и какие у него ограничения.
version: 1
topics:
  - id: instruments
    title: Инструменты рынка: как устроены и как ими пользоваться
    summary: Каждый инструмент — это набор прав, рисков и издержек; выбирать его нужно под задачу (доход, защита, спекуляция), а не по названию или обещанной доходности.
    points:
      - Акция — доля в компании: даёт право на часть прибыли и на остаток при ликвидации, но не гарантирует выплат
      - Облигация — заём: эмитент обязан платить купон и вернуть номинал, если не допустит дефолт
      - Доходность облигации зависит от цены покупки, купона и срока — купон сам по себе её не определяет
      - Фонд даёт диверсификацию и управление, но берёт комиссию и может отклоняться от индекса
      - Фьючерс — срочный контракт с плечом и обязательной экспирацией: убыток может превысить вложенное
      - Опцион даёт право, а не обязанность; покупатель ограничен премией, продавец — нет
      - Валюта и золото используются как защита от девальвации и инфляции, но не создают денежный поток
      - Плечо увеличивает и результат, и риск: при неблагоприятном движении позиция закрывается принудительно
      - Ликвидность инструмента определяет цену выхода — узкий рынок стоит дороже при продаже
      - Комиссии и налоги есть у любого инструмента — доходность считают после них
    details:
      - title: Акции
        points:
          - Дают право на дивиденды, участие в собрании и часть имущества при ликвидации
          - Доход формируется из дивидендов и изменения цены
          - Дополнительная эмиссия размывает долю существующих акционеров
          - Сплит меняет число акций и цену, но не стоимость позиции
          - Обыкновенные и привилегированные акции различаются правами и порядком выплат
      - title: Облигации
        points:
          - Купон бывает фиксированным, плавающим, индексируемым и с амортизацией номинала
          - Оферта даёт право досрочного выкупа или предъявления бумаги к погашению
          - Доходность к погашению учитывает цену, купоны и срок — по ней сравнивают выпуски
          - Дюрация измеряет чувствительность цены к ставке
          - Кредитный риск — вероятность невыплаты; он оплачивается спредом к ОФЗ
          - ОФЗ считаются безрисковыми по кредиту, но их цена зависит от ставки
      - title: Фонды
        points:
          - БПИФ торгуется на бирже как акция, ПИФ покупается по расчётной цене
          - Комиссия управляющей компании удерживается внутри стоимости пая
          - Ошибка следования показывает, насколько фонд отстаёт от индекса
          - Дивиденды фонда зависят от политики конкретного фонда
          - СЧА и ликвидность фонда проверяют до покупки
      - title: Срочный рынок
        points:
          - Фьючерс требует гарантийного обеспечения и ежедневного расчёта вариационной маржи
          - Экспирация обязывает закрыть позицию или принять поставку
          - Опцион покупателя ограничивает риск премией, продавец принимает риск на себя
          - Плечо на срочном рынке требует расчёта максимальной просадки, а не только потенциальной прибыли
          - Срочные инструменты подходят для хеджирования, а не для замены долгосрочных вложений
      - title: Как платить
        points:
          - Комиссия брокера за сделку и плата за обслуживание счёта
          - Биржевая и депозитарная комиссии при покупке и продаже
          - Комиссия фонда, удерживаемая из активов
          - Налог с прибыли, купонов и дивидендов удерживает брокер как агент
          - Плечо и срочный рынок добавляют плату за пользование заёмными средствами
          - Итоговую доходность считают после всех издержек
    pitfalls:
      - Покупать инструмент с плечом, не понимая механизма маржи
      - Считать купон облигации её доходностью
      - Выбирать фонд только по прошлой доходности
      - Путать сплит с ростом стоимости
      - Использовать срочный рынок вместо долгосрочного портфеля
