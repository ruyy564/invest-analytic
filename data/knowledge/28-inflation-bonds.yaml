# Тема: ОФЗ-ИН — облигации с индексируемым номиналом (Академия Т-Инвестиций).
version: 1
topics:
  - id: inflation-bonds
    title: ОФЗ с защитой от инфляции
    summary: У ОФЗ-ИН номинал индексируется по официальной инфляции, поэтому они защищают покупательную способность, но дают небольшой купон и чувствительны к цене.
    points:
      - Номинал индексируется по индексу потребительских цен Росстата — растёт вместе с инфляцией
      - Индексация идёт ежедневно с лагом около трёх месяцев: в расчёт попадают уже уточнённые данные
      - Купон считается от проиндексированного номинала, но ставка низкая — около 2,5 % против двузначных ставок обычных ОФЗ
      - Доход складывается из индексации номинала, купона и изменения рыночной цены
      - При погашении инвестор получает увеличенный номинал, поэтому покупательная способность сохраняется лучше
      - ОФЗ-ИН могут торговаться выше или ниже номинала — при продаже можно получить и прибыль, и убыток
      - Если фактическая инфляция ниже ожиданий, реальная доходность может оказаться скромной
      - Подходят для защиты капитала на длинном горизонте, а не для максимального текущего дохода
    details:
      - title: Как работает индексация
        points:
          - Базовый показатель — официальный ИПЦ, а не ожидания рынка
          - Номинал растёт постепенно, день за днём, а не раз в год
          - Лаг в три месяца нужен для точности статистики
          - Купон и выплата при погашении считаются от текущего проиндексированного номинала
      - title: Сравнение с обычными ОФЗ
        points:
          - ОФЗ-ПД дают фиксированный купон и высокую текущую доходность, но не защищают от инфляции
          - ОФЗ-ИН защищают номинал, но купон ниже — это плата за защиту
          - В период высокой инфляции ОФЗ-ИН выигрывают по реальной доходности
          - При дезинфляции фиксированные выпуски могут оказаться выгоднее
      - title: Риски
        points:
          - Цена может уйти ниже номинала при росте реальных ставок
          - Ликвидность ниже, чем у популярных выпусков ОФЗ-ПД
          - Инфляция по официальной методике может отличаться от личной потребительской корзины
          - Досрочная продажа зависит от рыночной цены, а не от накопленной инфляции
      - title: Кому подходит
        points:
          - Инвестору, которому важна покупательная способность, а не текущий купон
          - Для длинного горизонта и консервативной части портфеля
          - Как страховка на случай ускорения инфляции
          - Не подходит, если нужен регулярный высокий денежный поток
    pitfalls:
      - Сравнивать ОФЗ-ИН с обычными ОФЗ только по купону
      - Ждать мгновенной индексации номинала
      - Покупать длинный выпуск без учёта рыночной цены и дюрации
      - Считать официальную инфляцию личной инфляцией
    sections: [verdict, macro]
    sectors: [финансы]
    keywords: [офз-ин, инфляция, индексируемый номинал, ипц, росстат, защита от инфляции, реальная доходность, облигация]
    sources:
      - Т-Инвестиции, «Что такое ОФЗ-ИН и как они помогают защитить деньги от инфляции»
