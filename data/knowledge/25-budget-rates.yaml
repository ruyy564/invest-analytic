# Тема: бюджет, дефицит, заимствования и ставка (по материалам Т-Инвестиций).
version: 1
topics:
  - id: budget-rates
    title: Бюджет, дефицит и ставка
    summary: Дефицит бюджета финансируется заимствованиями: больше ОФЗ — выше доходности и давление на ставку, а значит и на оценку всех активов.
    points:
      - Дефицит считают не только в рублях, но и в процентах ВВП: 2,5 % ВВП при госдолге ниже 20 % — высоко, но не критично
      - Расходы растут быстрее доходов — дефицит расширяется, и Минфин закрывает его внутренними займами
      - Больше выпусков ОФЗ означает больше предложения долга: инвесторам нужна премия, доходности растут
      - Высокая доходность гособлигаций задаёт планку для корпоративных займов: деньги дорожают для всех
      - Расходы бюджета поддерживают внутренний спрос: выигрывают компании, продающие внутри страны
      - Налоговые изменения следующего года меняют денежные потоки компаний — эффект виден в марже, а не только в настроении
      - Резервы (ФНБ) и бюджетное правило сглаживают курс: траты из ФНБ означают продажу валюты и поддержку рубля
      - Дорогие заимствования и небольшие ликвидные резервы ограничивают возможности бюджета
    details:
      - title: Как читать цифры бюджета
        points:
          - План в законе и факт расходятся: роспись меняется в течение года, финальные параметры — в проекте бюджета
          - В начале года дефицит обычно выше из-за авансов по госзаказу, к концу года сжимается
          - Сравнивайте дефицит с ВВП и с историей: 6 % ВВП в 2009-м и 3,8 % в 2020-м — примеры шоковых лет
          - Смотрите, чем финансируется дефицит: займы, резервы или налоги — эффект на рынок разный
      - title: Влияние на облигации
        points:
          - Рост предложения ОФЗ давит на цены и поднимает доходности
          - Длинные выпуски чувствительнее к бюджетной теме, короткие — к ставке ЦБ
          - Корпоративные эмитенты вынуждены предлагать премию к ОФЗ, иначе не соберут деньги
          - Если инфляция ускоряется вместе с дефицитом, реальные доходности могут быть отрицательными
      - title: Влияние на акции и рубль
        points:
          - Компании внутреннего спроса получают поддержку от расходов бюджета
          - Экспортёры зависят от налогов и пошлин, а не только от мировых цен
          - Рост заимствований и инфляции удерживает ставку высокой — давление на оценки роста
          - Бюджетное правило и траты из ФНБ влияют на валютный рынок и курс
      - title: Что делать инвестору
        points:
          - Проверять, что уже в цене: рынок часто отыгрывает ожидание дефицита заранее
          - Не строить портфель на одном сценарии по ставке
          - Держать часть в коротких и флоатерах, если бюджетная тема разгоняет инфляцию
          - Следить за датами публикации проекта бюджета и заседаний ЦБ
    pitfalls:
      - Считать дефицит «катастрофой», не глядя на ВВП и структуру долга
      - Покупать длинные ОФЗ, ожидая быстрого снижения ставки при расширении дефицита
      - Игнорировать налоговые изменения при оценке компаний
      - Путать рост расходов бюджета с ростом экономики
    sections: [macro, verdict]
    sectors: [финансы]
    keywords: [бюджет, дефицит, офз, заимствования, госдолг, фнб, бюджетное правило, налоги, ставка, доходность]
