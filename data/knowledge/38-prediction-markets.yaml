# Тема: рынки предсказаний — вероятности событий как данные (Т-Инвестиции / Словарь инвестора).
version: 1
topics:
  - id: prediction-markets
    title: Рынки предсказаний
    summary: Рынки предсказаний дают оцифрованную вероятность события: толпа торгует контрактами «да/нет», и цена контракта показывает, какую вероятность рынок закладывает.
    points:
      - Платформа, где торгуют контрактами «Да» и «Нет» на исход события
      - Цена контракта — это вероятность в глазах рынка: 30 копеек за «да» ≈ 30 %
      - Средняя точность прогноза на Polymarket за месяц до события около 90 %, за несколько часов — близко к 100 %
      - Объём рынка вырос: Kalshi и Polymarket вместе превысили 50 млрд долларов к 2026 году
      - Прогнозы толпы используют СМИ (CNN, CNBC, WSJ) и брокеры (Robinhood, Interactive Brokers)
      - Инвестору полезно как индикатор вероятности: ставка ФРС, выборы, регуляторные решения
      - Ограничения: манипуляции, тонкая ликвидность, комиссии, регуляторные запреты
      - Это не замена анализу: рынок предсказаний показывает ожидание, а не справедливую стоимость актива
    details:
      - title: Почему толпа точнее
        points:
          - В цене сходятся деньги и информация множества участников
          - Ошибки отдельных участников взаимно гасятся
          - Неправильная оценка создаёт возможность заработать, поэтому её быстро исправляют
          - Чем ближе событие, тем меньше неопределённости и точнее цена
      - title: Как использовать инвестору
        points:
          - Смотреть вероятности решений ЦБ и регуляторов до заседания
          - Сравнивать ожидания рынка с собственным сценарием
          - Отслеживать резкие сдвиги вероятностей как сигнал новостей
          - Учитывать, что контракт — не прогноз цены акции
      - title: Ограничения и риски
        points:
          - Манипуляции на тонких рынках
          - Комиссии и спред съедают часть преимущества
          - Регуляторика в разных странах различается
          - Толпа ошибается на редких событиях («чёрные лебеди»)
          - Ликвидность контракта может исчезнуть к дате события
      - title: Что важно не путать
        points:
          - Рынок предсказаний — про вероятность, а не про доходность
          - Ожидание рынка не означает, что событие произойдёт
          - Вероятность события не равна влиянию на бумагу
          - Деньги на контрактах блокируются до расчёта
    pitfalls:
      - Принимать вероятность за гарантию
      - Строить стратегию на одном рынке предсказаний
      - Игнорировать комиссии и ликвидность
      - Путать ставку на событие с инвестицией в актив
    sections: [macro, opinions]
    sectors: []
    keywords: [рынки предсказаний, prediction markets, polymarket, kalshi, вероятность, мудрость толпы, ожидания, ставка фрс]
