# Тема: как оценивать «будет ли расти рынок» — триггеры разворота (Т-Инвестиции).
version: 1
topics:
  - id: market-outlook
    title: Будет ли расти рынок
    summary: Разворот рынка складывается из капитуляции продавцов, устранения технических причин падения и смены ожиданий; сам прогноз направления остаётся вероятностным, а не точным.
    points:
      - Падение и рост чаще объясняются сочетанием причин: геополитика, ожидания по ставке, налоги, технические факторы
      - Капитуляция — рекордные маржин-коллы и панические продажи — часто совпадает с локальным дном
      - Технические причины важны: пик дивидендных отсечек снимает давление на индекс
      - Шорт-сквиз может дать быстрый рост второго и третьего эшелона, но не меняет фундаментальную картину
      - Смена ожиданий по ставке (неожиданное снижение) снимает часть страхов рынка
      - Восстановление после паники — это нормализация настроений, а не гарантия нового тренда
      - Корневые риски (геополитика, бюджет, инфляция) сохраняются, пока не изменились
      - Прогноз направления — вероятностный: указывайте сценарии и условия, а не одну цифру
    details:
      - title: Что смотреть при развороте
        points:
          - Капитуляция: объёмы, маржин-коллы, паника в рознице
          - Технические события: дивидендные отсечки, запреты шортов, дискретные аукционы
          - Ставка и риторика ЦБ: изменение ожиданий двигает оценки
          - Внешний фон: нефть, курс, глобальные рынки
          - Широта роста: растёт весь рынок или только несколько бумаг
      - title: Как формулировать ответ
        points:
          - Сначала факты: индекс, динамика, объёмы, ключевые события
          - Затем механизм: почему именно это двигало рынок
          - Затем сценарии: что должно произойти для роста и для падения
          - Затем инвалидаторы: какой факт развернёт вывод
          - Отдельно — чего в данных нет
      - title: Ограничения прогноза
        points:
          - Рынок реагирует на ожидания, а не только на факты
          - Новости геополитики не прогнозируются моделями
          - Исторические закономерности не гарантируют повторения
          - Один сильный фактор может перебить всю конструкцию
      - title: Роль облигационного рынка
        points:
          - Доходности облигаций часто двигаются раньше акций
          - Рост доходностей при неизменной ставке — сигнал ожиданий ужесточения
          - Инверсия кривой и спред к ОФЗ показывают напряжение
          - Следить за рынком облигаций полезно даже при портфеле из акций
    pitfalls:
      - Объявлять дно после одной зелёной недели
      - Считать шорт-сквиз началом устойчивого тренда
      - Давать одну цифру индекса без сценариев
      - Игнорировать технические причины движения
    sections: [macro, verdict]
    sectors: []
    keywords: [рынок, индекс, разворот, капитуляция, маржин-колл, шорт-сквиз, отсечка, ставка, сценарий, прогноз]
    sources:
      - Т-Инвестиции, «Лучшая неделя за 17 лет: почему вырос рынок и ждать ли падения»
