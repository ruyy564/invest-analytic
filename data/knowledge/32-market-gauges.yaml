# Тема: ориентиры на бирже — списки, секторы, индексы и необычные индикаторы.
version: 1
topics:
  - id: market-gauges
    title: Ориентиры на бирже
    summary: Рынок даёт три быстрых ориентира — котировальные списки (риск), секторы (от чего зависит бизнес) и индексы (картина целиком); необычные индексы показывают инфляцию и настроения, но инвестировать в них нельзя.
    points:
      - Котировальный список — уровень допуска бумаги: первый список строже, третий — мягче, это первая оценка риска
      - Сектор показывает, от чего зависит бизнес: нефть, ставка, импорт, тарифы, потребительский спрос
      - Биржевой индекс — корзина активов по признаку; состав IMOEX пересматривается раз в квартал
      - Индексные фонды дают широкий рынок без покупки десятков акций
      - Голубые фишки ликвиднее и спокойнее, второй эшелон — больше потенциала и больше риска
      - Защитные акции ищут в секторах со стабильным спросом: коммунальные, потребительский минимум, сырьё
      - Необычные индексы (борща, оливье, Биг-Мака, помады, небоскрёбов) — индикаторы инфляции, настроений и покупательной способности
      - Индекс борща отражает продуктовую инфляцию: минимальные цены набора для семьи из четырёх, 36 городов, замер раз в квартал
      - Эффект помады: в кризис растут продажи недорогой косметики как замена дорогим покупкам
      - Индекс небоскрёбов: рекордные высотки часто совпадают с перегревом экономики и последующим спадом
    details:
      - title: Котировальные списки
        points:
          - Первый список — самые высокие требования к эмитенту и ликвидности
          - Второй и третий — выше риск и ниже ликвидность
          - Список не заменяет кредитный анализ, но быстро отсекает слабые бумаги
          - Смена списка — событие для бумаги: индексные фонды могут её купить или продать
      - title: Секторы и сценарии
        points:
          - Слабый рубль помогает экспортёрам и вредит импортёрам
          - Рост ставки помогает банкам на коротком отрезке и вредит застройщикам и лизингу
          - Замедление спроса бьёт по ритейлу и дорогим товарам
          - Тарифы и госзаказ определяют доходы инфраструктурных компаний
      - title: Необычные индексы
        points:
          - Индекс оливье считается с 2009 года по данным Росстата, публикуется в ноябре
          - Индекс Биг-Мака сравнивает покупательную способность валют
          - Индексы продуктов отслеживают инфляцию, но не показывают доходность активов
          - Использовать их можно как иллюстрацию инфляции, а не как торговый сигнал
      - title: Как применять на практике
        points:
          - Начинать с индекса: понять, растёт рынок целиком или отдельные истории
          - Затем сектор: сравнить бумагу с аналогами, а не с рынком вообще
          - Затем список: оценить риск и ликвидность
          - Необычные индексы — для объяснения инфляционных эффектов в ответе инвестору
    pitfalls:
      - Покупать бумагу второго-третьего списка, не учитывая ликвидность
      - Сравнивать бумагу с индексом, не глядя на её сектор
      - Считать необычные индексы инвестиционными инструментами
      - Делать вывод по одной корзине без проверки состава
    sections: [opinions, verdict, macro]
    sectors: []
    keywords: [индекс, котировальный список, сектор, голубые фишки, второй эшелон, индексный фонд, индекс борща, оливье, бигмак, небоскрёбы, помада]
    sources:
