# Тема: экономические циклы.
# Файл — часть базы знаний: каталог читается целиком, порядок задаёт имя файла.
# В тезисах нет текущих чисел рынка — только принципы и исторические иллюстрации.
version: 1
topics:
  - id: cycles
    title: Экономические циклы
    summary: Цикл — чередование фаз роста, перегрева, спада и восстановления; для инвестора важна не дата разворота, а то, какие классы активов и секторы обычно устойчивее в каждой фазе.
    points:
      - Фазы различают по росту ВВП, инфляции, ставке ЦБ и занятости — один показатель фазу не определяет
      - Ставка действует с задержкой в несколько кварталов, поэтому рынок реагирует на ожидания, а не на текущее значение
      - В восстановлении обычно сильнее акции роста и цикличные секторы, в поздней фазе — качество и дивиденды
      - В спаде растёт спрос на защитные классы — облигации высокого качества, золото, валютная диверсификация
      - Диверсификация по классам активов важнее попытки угадать фазу — ошибка фазы стоит дороже комиссии
      - Портфель, собранный под одну фазу, уязвим в следующей — структуру проверяют регулярно, а не раз в год
      - Признак перегрева — рост долгов и падение качества заёмщиков, а не только высокие цены активов
      - Кредит и ликвидность определяют скорость цикла сильнее, чем настроение участников
    details:
      - title: Фазы цикла и что происходит
        points:
          - Восстановление — низкая ставка, оживление кредита, рост прибылей, рынок акций обычно впереди экономики
          - Рост — прибыли растут, инфляция умеренная, растёт аппетит к риску и к цикличным секторам
          - Перегрев — инфляция ускоряется, ставка растёт, оценки сжимаются, качество активов ухудшается
          - Спад — прибыли падают, растёт безработица, защитные классы и качество выигрывают у роста
      - title: Индикаторы, на которые смотрят
        points:
          - Ставка ЦБ и её ожидания, кривая доходности, инфляция и инфляционные ожидания
          - Промышленное производство, загрузка мощностей, инвестиции в основной капитал
          - Потребительский спрос, сбережения, реальные доходы населения
          - Кредитование и качество кредитного портфеля банков — ранний признак разворота
          - Занятость и вакансии — запаздывающий, но устойчивый индикатор фазы
      - title: Классы активов по фазам
        points:
          - Восстановление — акции роста и малые компании, длинные облигации
          - Рост — акции цикличных секторов, корпоративные облигации
          - Перегрев — сырьё и защита от инфляции, короткие облигации, качество
          - Спад — государственные облигации высокого качества, золото, кэш под реинвестирование
      - title: Как это применять к портфелю
        points:
          - Сначала проверяют структуру по классам, потом по секторам — перекос в одном секторе перевешивает фазу
          - Фазу используют для трактовки, а не для разовой ставки на один сценарий
          - Если структура не переживает спад, добавляют защитные классы, а не угадывают дату разворота
          - Дату разворота не знает никто — поэтому важнее допустимая просадка, чем точность прогноза
    pitfalls:
      - Принимать одно значение ставки или инфляции за смену фазы
      - Считать, что прошлая фаза повторится с той же длительностью
      - Строить весь портфель под один сценарий рынка
      - Путать рост цен активов с улучшением фундаментальных показателей
    sections: [macro, verdict]
    sectors: []
    keywords: [цикл, циклы, рецессия, спад, восстановление, перегрев, фаза, стагфляция, кредитный цикл]
    sources:
      - Говард Маркс, «О самом важном» — про циклы и риск
      - Рэй Далио, «Принципы изменения мирового порядка» — про долговые циклы
      - Чарльз Киндлбергер, «Мировые финансовые кризисы» — про механику перегрева
