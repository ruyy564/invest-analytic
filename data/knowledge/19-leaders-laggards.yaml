# Тема: лидеры и аутсайдеры сектора — сравнение важнее абсолютной динамики.
version: 1
topics:
  - id: leaders-laggards
    title: Лидеры и аутсайдеры
    summary: В одном секторе бумаги делятся на тех, кто выигрывает от текущей конъюнктуры, и тех, кто проигрывает; сравнение с сектором и рынком говорит больше, чем абсолютная доходность.
    points:
      - Лидерство в секторе определяется не размером компании, а тем, насколько её бизнес-модель подходит текущей фазе
      - Сравнивать нужно по динамике, оценке, марже, долгу и дивидендам — по одной метрике вывод будет ложным
      - Бумага, которая падает меньше сектора, — относительный лидер, даже если доходность отрицательная
      - «Дешёвая» бумага часто аутсайдер с причиной: дисконт отражает риск, а не подарок
      - При смене фазы цикла лидеры и аутсайдеры меняются местами — ротация начинается раньше отчётности
      - Аутсайдер с крепким балансом и понятным драйвером восстановления интереснее лидера на пике оценки
      - Один и тот же фактор делает лидера из одной компании и аутсайдера из другой: рост ставки помогает банкам и вредит застройщикам
    details:
      - title: Критерии сравнения
        points:
          - Динамика за 1, 7, 30 и 180 дней относительно сектора и индекса — кто сильнее в тренде
          - Оценка: P/E и P/B против медианы сектора, с поправкой на рост и риск
          - Качество: маржа, долг, денежный поток — лидер без денежного потока живёт на ожиданиях
          - Дивиденды и политика распределения: устойчивая выплата отличает зрелого лидера от спекулятивной истории
          - Новостной поток: у лидера новости про рост, у аутсайдера — про долг, суды и смену менеджмента
      - title: Ловушки
        points:
          - Ловушка стоимости: бумага дешевеет быстрее, чем падает оценка, потому что падает прибыль
          - Ловушка роста: лидерство за счёт разовых факторов, которые не повторятся
          - Экстраполяция: последние шесть месяцев не гарантируют следующие
          - Игнорирование ликвидности: у аутсайдеров спред шире, а выход дороже
      - title: Как заметить смену лидера
        points:
          - Первыми меняются относительная динамика и оценка, отчётность подтверждает позже
          - Смена драйвера — ставка, тариф, курс — переворачивает расстановку сил в секторе
          - Рост доли рынка и маржи у аутсайдера при слабом лидере — ранний сигнал ротации
          - Новый менеджмент или новая стратегия у аутсайдера часто предшествует переоценке
      - title: Сравнение внутри портфеля
        points:
          - Ранжируйте позиции по относительной силе и вкладу в риск, а не по размеру
          - Слабейшая позиция по совокупности факторов — кандидат на пересмотр, а не на усреднение
          - Сильная позиция на пике оценки — риск концентрации, а не повод увеличивать
          - Портфель из аутсайдеров одного сектора — это одна ставка на разворот, а не диверсификация
    pitfalls:
      - Судить о силе по абсолютному росту без сравнения с рынком
      - Считать дешевизну преимуществом без проверки долга и прибыли
      - Покупать лидера после длинного роста без оценки, что уже в цене
      - Путать отраслевой лидер и лидер по капитализации
    sections: [opinions, verdict, macro]
    sectors: []
    keywords: [лидер, аутсайдер, сравнение, сектор, ротация, относительная сила, дисконт, оценка, медиана]
    sources:
