# Дополнительные новостные ленты: подключаются данными, без правки кода.
#
# Формат записи: id, url, format (rss | atom | json), topics (news, market, macro, tax)
# и необязательные fallbackUrl / summaryLimit. Файл читается из NEWS_EXTRA_FEEDS_FILE;
# файла нет или список пуст — дополнительных источников нет.
#
# Ниже — проверенные 07.11.2026 адреса (HTTP 200 и разбор ленты): ЦБ, «Прайм»,
# БФМ, Banki.ru, РИА «Экономика», «Коммерсантъ» (бизнес). Биржевые страницы,
# которые отдают 403/404 (finmarket, forbes, angi, oilcapital), не подключены —
# у них берём RSS только при появлении рабочего адреса.

- id: cbr
  url: https://www.cbr.ru/rss/eventrss
  format: rss
  topics: [news, macro]

- id: prime
  url: https://1prime.ru/export/rss2/index.xml
  format: rss
  topics: [news, macro]

