services:
  agent:
    build: .
    env_file:
      - .env
    environment:
      # Контейнер не видит локальные правки окружения разработчика: URL и TLS до
      # T-Invest передаём явно, чтобы живой прогон не зависел от старых значений в `.env`.
      MCP_TINKOFF_URL: https://invest-public-api.tbank.ru/mcp
      MCP_TINKOFF_TLS_MODE: extra-ca
      MCP_TINKOFF_CA_FILE: /app/certs/mcp-chain.pem
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
